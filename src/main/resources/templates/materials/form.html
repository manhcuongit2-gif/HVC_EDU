<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quản lý tài liệu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-4"><a th:href="${returnUrl}" class="btn btn-outline-secondary btn-sm mb-3">← Danh sách tài liệu</a>
    <div class="card border-0 shadow-sm"><div class="card-header bg-white"><h1 class="h4 mb-0" th:text="${material == null ? 'Thêm tài liệu' : 'Sửa tài liệu'}"></h1></div>
        <div class="card-body"><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <form method="post" enctype="multipart/form-data" th:action="${actionUrl}">
                <div class="mb-3"><label class="form-label">Lớp</label><select class="form-select" name="classId" required>
                    <option value="">-- Chọn lớp --</option><option th:each="c : ${classes}" th:value="${c.id}" th:selected="${material != null && material.classEntity.id == c.id}" th:text="${c.name}"></option>
                </select></div>
                <div class="mb-3"><label class="form-label">Tên tài liệu</label><input class="form-control" name="title" maxlength="150" required th:value="${material != null ? material.title : ''}"></div>
                <div class="mb-3"><label class="form-label">Mô tả</label><textarea class="form-control" name="description" rows="3" maxlength="1000" th:text="${material != null ? material.description : ''}"></textarea></div>
                <div class="mb-3"><label class="form-label">Liên kết ngoài (tùy chọn)</label><input class="form-control" type="url" name="externalUrl" placeholder="https://..." th:value="${material != null ? material.externalUrl : ''}"></div>
                <div class="mb-3"><label class="form-label">Tệp (PDF, Word, Excel, PowerPoint hoặc ảnh; tối đa 20 MB)</label><input class="form-control" type="file" name="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.jpg,.jpeg,.png,.gif,.webp"></div>
                <p class="small text-muted" th:if="${material != null && material.storedFilename != null}">Tệp hiện tại: <span th:text="${material.originalFilename}"></span>. Để trống nếu muốn giữ tệp này.</p>
                <div class="d-flex justify-content-end gap-2"><a th:href="${returnUrl}" class="btn btn-light">Hủy</a><button class="btn btn-primary">Lưu tài liệu</button></div>
            </form>
        </div>
    </div>
</main></body></html>
