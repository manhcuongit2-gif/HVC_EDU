<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán không thành công - EduCenter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .fail-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 520px;
            margin: 60px auto;
            background: #fff;
            padding: 40px;
            text-align: center;
        }
        .fail-icon {
            width: 80px;
            height: 80px;
            background: #f8d7da;
            color: #dc3545;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="fail-card">
        <div class="fail-icon">
            <i class="bi bi-x-lg"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">Thanh toán không thành công!</h3>
        <p class="text-muted mb-4">Giao dịch qua VNPay đã bị hủy hoặc có lỗi xảy ra trong quá trình thanh toán.</p>

        <div class="alert alert-danger text-start mb-4" th:if="${payment != null}">
            <div class="mb-1"><strong>Mã phản hồi VNPay:</strong> <span th:text="${payment.vnpayResponseCode}">24</span></div>
            <div class="mb-0"><strong>Chi tiết:</strong> <span th:text="${payment.note}">Giao dịch không thành công</span></div>
        </div>

        <div class="alert alert-danger text-start mb-4" th:if="${errorMessage != null}">
            <span th:text="${errorMessage}"></span>
        </div>

        <div class="d-flex justify-content-center gap-2">
            <a th:href="@{/parent/tuition}" class="btn btn-primary px-4 py-2">
                <i class="bi bi-arrow-repeat me-1"></i>Thử lại / Về danh sách học phí
            </a>
            <a th:href="@{/}" class="btn btn-outline-secondary px-4 py-2">
                <i class="bi bi-house me-1"></i>Trang chủ
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
