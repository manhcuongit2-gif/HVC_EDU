<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán thành công - Luyện Thi Hùng Cường</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .success-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 550px;
            margin: 60px auto;
            background: #fff;
            padding: 40px;
            text-align: center;
        }
        .success-icon {
            width: 80px;
            height: 80px;
            background: #d1e7dd;
            color: #198754;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            margin-bottom: 24px;
        }
        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #e9ecef;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="success-card">
        <div class="success-icon">
            <i class="bi bi-check-lg"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">Giao dịch thành công!</h3>
        <p class="text-muted mb-4">Cảm ơn bạn đã thanh toán học phí qua Cổng VNPay.</p>

        <div class="bg-light p-3 rounded-3 text-start mb-4" th:if="${payment != null}">
            <div class="detail-item">
                <span class="text-muted">Mã giao dịch VNPay:</span>
                <strong class="text-dark" th:text="${payment.transactionCode}">VNP123456</strong>
            </div>
            <div class="detail-item" th:if="${tuition != null}">
                <span class="text-muted">Lớp học:</span>
                <strong class="text-primary" th:text="${tuition.classEntity.name}">Toán 10 - Nâng Cao</strong>
            </div>
            <div class="detail-item" th:if="${tuition != null}">
                <span class="text-muted">Học sinh:</span>
                <strong class="text-dark" th:text="${tuition.student.fullName}">Hoàng Nam</strong>
            </div>
            <div class="detail-item">
                <span class="text-muted">Số tiền thanh toán:</span>
                <strong class="text-success fs-5" th:text="${#numbers.formatDecimal(payment.amount, 0, 'COMMA', 0, 'POINT')} + ' đ'">1.200.000 đ</strong>
            </div>
            <div class="detail-item">
                <span class="text-muted">Thời gian giao dịch:</span>
                <span class="text-secondary" th:text="${#temporals.format(payment.paymentDate, 'dd/MM/yyyy HH:mm:ss')}">01/10/2026 10:00:00</span>
            </div>
            <div class="detail-item border-bottom-0 pb-0">
                <span class="text-muted">Phương thức:</span>
                <span class="badge bg-primary-subtle text-primary">Cổng thanh toán VNPay</span>
            </div>
        </div>

        <div class="d-flex justify-content-center gap-2">
            <a th:href="@{/parent/tuition}" class="btn btn-primary px-4 py-2">
                <i class="bi bi-receipt me-1"></i>Xem danh sách học phí
            </a>
            <a th:href="@{/}" class="btn btn-outline-secondary px-4 py-2">
                <i class="bi bi-house me-1"></i>Trang chủ
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
