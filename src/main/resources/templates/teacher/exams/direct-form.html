<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tạo đề trực tuyến</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4">
  <a th:href="@{/teacher/exams/create}">← Chọn loại đề</a><h1 class="h3 mt-2">Tạo đề nhập trực tiếp</h1>
  <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
  <form class="card border-0 shadow-sm rounded-4" method="post" th:action="@{/teacher/exams/create/direct}" th:object="${form}">
    <div class="card-body row g-3">
      <div class="col-md-6"><label class="form-label">Tên đề</label><input class="form-control" th:field="*{title}" maxlength="150" required></div>
      <div class="col-md-6"><label class="form-label">Lớp được giao</label><select class="form-select" th:field="*{classId}" required><option value="">Chọn lớp</option><option th:each="c : ${classes}" th:value="${c.id}" th:text="|${c.name} · ${c.subject.name}|"></option></select></div>
      <div class="col-md-3"><label class="form-label">Mở đề</label><input class="form-control" type="datetime-local" th:field="*{opensAt}" required></div>
      <div class="col-md-3"><label class="form-label">Đóng đề</label><input class="form-control" type="datetime-local" th:field="*{closesAt}" required></div>
      <div class="col-md-3"><label class="form-label">Thời lượng (phút)</label><input class="form-control" type="number" min="1" max="240" th:field="*{durationMinutes}" required></div>
      <div class="col-md-3"><label class="form-label">Số lượt tối đa</label><input class="form-control" type="number" min="1" max="10" th:field="*{maxAttempts}" required></div>
      <div class="col-12"><div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" th:field="*{shuffleQuestions}"><label class="form-check-label">Đảo thứ tự câu</label></div><div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" th:field="*{shuffleOptions}"><label class="form-check-label">Đảo thứ tự lựa chọn</label></div></div>
      <div class="col-12"><h2 class="h5">Câu hỏi</h2><div id="questions">
        <section th:each="question,stat : *{questions}" class="question card bg-light border mb-3"><div class="card-body row g-2">
          <div class="col-md-4"><label class="form-label">Dạng câu</label><select class="form-select q-type" th:name="|questions[${stat.index}].type|"><option value="MULTIPLE_CHOICE" th:selected="${question.type == 'MULTIPLE_CHOICE'}">Trắc nghiệm</option><option value="TRUE_FALSE" th:selected="${question.type == 'TRUE_FALSE'}">Đúng / Sai</option><option value="FILL_IN" th:selected="${question.type == 'FILL_IN'}">Trả lời ngắn</option><option value="ESSAY" th:selected="${question.type == 'ESSAY'}">Tự luận</option></select></div>
          <div class="col-md-3"><label class="form-label">Điểm</label><input class="form-control" type="number" min="0.01" max="100" step="0.01" th:name="|questions[${stat.index}].points|" th:value="${question.points}" required></div>
          <div class="col-12"><label class="form-label">Nội dung câu hỏi</label><textarea class="form-control" rows="3" maxlength="10000" th:name="|questions[${stat.index}].prompt|" th:text="${question.prompt}" required></textarea></div>
          <div class="col-md-6"><label class="form-label">Lựa chọn A</label><input class="form-control" th:name="|questions[${stat.index}].optionA|" th:value="${question.optionA}"></div><div class="col-md-6"><label class="form-label">Lựa chọn B</label><input class="form-control" th:name="|questions[${stat.index}].optionB|" th:value="${question.optionB}"></div>
          <div class="col-md-6"><label class="form-label">Lựa chọn C (không bắt buộc)</label><input class="form-control" th:name="|questions[${stat.index}].optionC|" th:value="${question.optionC}"></div><div class="col-md-6"><label class="form-label">Lựa chọn D (không bắt buộc)</label><input class="form-control" th:name="|questions[${stat.index}].optionD|" th:value="${question.optionD}"></div>
          <div class="col-md-4"><label class="form-label">Đáp án đúng</label><select class="form-select" th:name="|questions[${stat.index}].correctKey|"><option value="" th:selected="${question.correctKey == null or question.correctKey.isBlank()}">Chọn đáp án</option><option value="A" th:selected="${question.correctKey == 'A'}">A (hoặc Đúng)</option><option value="B" th:selected="${question.correctKey == 'B'}">B (hoặc Sai)</option><option value="C" th:selected="${question.correctKey == 'C'}">C</option><option value="D" th:selected="${question.correctKey == 'D'}">D</option></select></div>
          <div class="col-md-8"><label class="form-label">Đáp án chấp nhận cho trả lời ngắn (mỗi dòng một đáp án)</label><textarea class="form-control" rows="2" th:name="|questions[${stat.index}].acceptedAnswers|" th:text="${question.acceptedAnswers}"></textarea></div>
          <div class="col-12 text-end"><button type="button" class="btn btn-sm btn-outline-danger remove-question">Xóa câu</button></div>
        </div></section>
      </div><button type="button" id="addQuestion" class="btn btn-outline-secondary">Thêm câu hỏi</button></div>
      <div class="col-12"><div class="alert alert-info small">Trả lời ngắn được chấm khi khớp chính xác sau khi chuẩn hóa chữ hoa/thường và khoảng trắng. Câu tự luận chờ giáo viên chấm; điểm chỉ hiện sau khi đề được công bố.</div><button class="btn btn-primary">Tạo và giao đề</button></div>
    </div>
  </form>
</main>
<template id="questionTemplate"><section class="question card bg-light border mb-3"><div class="card-body row g-2">
  <div class="col-md-4"><label class="form-label">Dạng câu</label><select class="form-select q-type" name="questions[__index__].type"><option value="MULTIPLE_CHOICE">Trắc nghiệm</option><option value="TRUE_FALSE">Đúng / Sai</option><option value="FILL_IN">Trả lời ngắn</option><option value="ESSAY">Tự luận</option></select></div>
  <div class="col-md-3"><label class="form-label">Điểm</label><input class="form-control" type="number" min="0.01" max="100" step="0.01" name="questions[__index__].points" value="1" required></div>
  <div class="col-12"><label class="form-label">Nội dung câu hỏi</label><textarea class="form-control" rows="3" maxlength="10000" name="questions[__index__].prompt" required></textarea></div>
  <div class="col-md-6"><label class="form-label">Lựa chọn A</label><input class="form-control" name="questions[__index__].optionA"></div><div class="col-md-6"><label class="form-label">Lựa chọn B</label><input class="form-control" name="questions[__index__].optionB"></div>
  <div class="col-md-6"><label class="form-label">Lựa chọn C (không bắt buộc)</label><input class="form-control" name="questions[__index__].optionC"></div><div class="col-md-6"><label class="form-label">Lựa chọn D (không bắt buộc)</label><input class="form-control" name="questions[__index__].optionD"></div>
  <div class="col-md-4"><label class="form-label">Đáp án đúng</label><select class="form-select" name="questions[__index__].correctKey"><option value="">Chọn đáp án</option><option value="A">A (hoặc Đúng)</option><option value="B">B (hoặc Sai)</option><option value="C">C</option><option value="D">D</option></select></div>
  <div class="col-md-8"><label class="form-label">Đáp án chấp nhận cho trả lời ngắn (mỗi dòng một đáp án)</label><textarea class="form-control" rows="2" name="questions[__index__].acceptedAnswers"></textarea></div>
  <div class="col-12 text-end"><button type="button" class="btn btn-sm btn-outline-danger remove-question">Xóa câu</button></div>
</div></section></template>
<script>
(() => {
  const container = document.getElementById('questions');
  const template = document.getElementById('questionTemplate');
  document.getElementById('addQuestion').addEventListener('click', () => {
    const index = container.querySelectorAll('.question').length;
    const html = template.innerHTML.replaceAll('__index__', String(index));
    container.insertAdjacentHTML('beforeend', html);
  });
  container.addEventListener('click', event => {
    if (!event.target.classList.contains('remove-question')) return;
    if (container.querySelectorAll('.question').length <= 1) return;
    event.target.closest('.question').remove();
    container.querySelectorAll('.question').forEach((card, index) => card.querySelectorAll('[name]').forEach(input => {
      input.name = input.name.replace(/questions\[\d+\]/, `questions[${index}]`);
    }));
  });
})();
</script>
</body></html>
