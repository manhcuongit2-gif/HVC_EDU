<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Xem trước đề</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4">
  <a th:href="@{/teacher/exams/blueprints}">← Đề thi</a>
  <div class="d-flex justify-content-between align-items-center mt-2"><div>
    <h1 class="h3" th:text="${blueprint.title}"></h1>
    <p class="text-secondary mb-1" th:text="|${blueprint.subject.name} · ${blueprint.gradeLevel} · ${blueprint.durationMinutes} phút · ${blueprint.totalPoints} điểm|"></p>
    <p class="small text-secondary" th:if="${blueprint.scope != null and !blueprint.scope.isBlank()}" th:text="|Phạm vi: ${blueprint.scope}|"></p>
  </div><a class="btn btn-primary" th:href="@{/teacher/exams/blueprints/{id}/assign(id=${blueprint.id})}">Giao đề cho lớp</a></div>
  <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

  <form method="post" th:action="@{/teacher/exams/blueprints/{id}/points(id=${blueprint.id})}">
    <div class="card border-0 shadow-sm rounded-4"><div class="card-header bg-white d-flex justify-content-between"><strong>Xem trước / thay câu / chỉnh điểm</strong><button class="btn btn-sm btn-outline-primary">Lưu điểm</button></div>
      <div class="card-body"><article th:each="row,stat : ${items}" class="border-bottom py-3">
        <div class="d-flex justify-content-between gap-2"><strong th:text="|Câu ${stat.count} · ${row.item.question.questionType} · ${row.item.question.topic != null ? row.item.question.topic : 'Chưa phân loại'}|"></strong>
          <div class="d-flex gap-2"><input class="form-control form-control-sm" style="width:110px" type="number" min="0.01" step="0.01" th:name="|points[${row.item.id}]|" th:value="${row.item.points}"><button class="btn btn-sm btn-outline-secondary" type="submit" th:formaction="@{/teacher/exams/blueprints/{id}/items/{itemId}/replace(id=${blueprint.id},itemId=${row.item.id})}">Thay câu</button></div>
        </div>
        <div class="math-content mt-2" style="white-space:pre-wrap" th:text="${row.item.question.prompt}"></div>
        <ul class="small mb-1"><li th:each="opt : ${row.options}" th:text="|${opt.key}. ${opt.text}|"></li></ul>
        <div class="small text-secondary" th:if="${row.correctAnswer != null and !row.correctAnswer.isBlank()}" th:text="|Đáp án chuẩn: ${row.correctAnswer}|"></div>
        <div class="small text-secondary" th:if="${row.explanation != null}" th:text="|Lời giải: ${row.explanation}|"></div>
      </article><div th:if="${#lists.isEmpty(items)}" class="text-secondary">Đề chưa có câu hỏi.</div></div>
    </div>
  </form>
  <script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</main>
</body></html>
