<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ngân hàng câu hỏi</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><div><h1 class="h3 mb-1">Ngân hàng câu hỏi</h1><p class="text-secondary mb-0">Mỗi giáo viên chỉ quản lý câu hỏi do mình tạo.</p></div><div class="d-flex gap-2"><a class="btn btn-primary" th:href="@{/teacher/exams/create}">Tạo đề thi</a><a class="btn btn-outline-primary" th:href="@{/teacher/exams/blueprints}">Đề nháp cũ</a><a class="btn btn-outline-primary" th:href="@{/teacher/exams/assignments}">Đề đã giao</a></div></div>
  <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
  <section class="card border-0 shadow-sm rounded-4 mb-4"><div class="card-header bg-white fw-semibold" th:text="${questionForm.id == null ? 'Thêm câu hỏi' : 'Sửa câu hỏi'}">Thêm câu hỏi</div><div class="card-body"><form th:action="@{/teacher/exams/questions}" th:object="${questionForm}" method="post" class="row g-3">
    <input type="hidden" th:field="*{id}">
    <div class="col-md-4"><label class="form-label">Môn học</label><select class="form-select" th:field="*{subjectId}" required><option value="">Chọn môn</option><option th:each="subject : ${subjects}" th:value="${subject.id}" th:text="${subject.name}"></option></select></div>
    <div class="col-md-2"><label class="form-label">Khối</label><select class="form-select" th:field="*{gradeLevel}" required><option value="">Chọn khối</option><option th:each="g : ${#numbers.sequence(6,12)}" th:value="|Lớp ${g}|" th:text="|Lớp ${g}|"></option></select></div>
    <div class="col-md-3"><label class="form-label">Chủ đề (nhãn)</label><input class="form-control" th:field="*{topic}" maxlength="150" placeholder="Ví dụ: Phân số"></div>
    <div class="col-md-3"><label class="form-label">Độ khó</label><select class="form-select" th:field="*{difficulty}"><option value="EASY">Dễ</option><option value="MEDIUM">Trung bình</option><option value="HARD">Khó</option></select></div>
    <div class="col-md-4"><label class="form-label">Dạng câu</label><select class="form-select" th:field="*{questionType}"><option value="MULTIPLE_CHOICE">Trắc nghiệm một đáp án</option><option value="TRUE_FALSE">Đúng / Sai</option><option value="FILL_IN">Điền đáp án</option><option value="ESSAY">Tự luận</option></select></div>
    <div class="col-md-2"><label class="form-label">Điểm mặc định</label><input class="form-control" type="number" min="0.01" max="100" step="0.01" th:field="*{defaultPoints}" required></div>
    <div class="col-12"><label class="form-label">Nội dung <small class="text-secondary">(có thể dùng $...$ hoặc $$...$$ cho công thức)</small></label><textarea id="questionPrompt" class="form-control" rows="4" th:field="*{prompt}" maxlength="10000" required></textarea><div class="form-text">Xem trước:</div><div id="formulaPreview" class="border rounded p-3 bg-light math-content" style="white-space:pre-wrap" th:text="${questionForm.prompt}"></div></div>
    <div class="col-12 row g-2 question-fields" data-question-type="MULTIPLE_CHOICE" th:classappend="${questionForm.questionType != 'MULTIPLE_CHOICE' ? ' d-none' : ''}"><div class="col-md-3"><label class="form-label">Phương án A</label><input class="form-control" th:field="*{optionA}"></div><div class="col-md-3"><label class="form-label">Phương án B</label><input class="form-control" th:field="*{optionB}"></div><div class="col-md-3"><label class="form-label">Phương án C</label><input class="form-control" th:field="*{optionC}"></div><div class="col-md-3"><label class="form-label">Phương án D</label><input class="form-control" th:field="*{optionD}"></div><div class="col-md-3"><label class="form-label">Đáp án đúng</label><select class="form-select" th:field="*{correctKey}"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select></div></div>
    <div class="col-md-4 question-fields" data-question-type="TRUE_FALSE" th:classappend="${questionForm.questionType != 'TRUE_FALSE' ? ' d-none' : ''}"><label class="form-label">Đáp án đúng</label><select class="form-select" th:field="*{correctKey}"><option value="A">Đúng</option><option value="B">Sai</option></select></div>
    <div class="col-12 question-fields" data-question-type="FILL_IN" th:classappend="${questionForm.questionType != 'FILL_IN' ? ' d-none' : ''}"><label class="form-label">Đáp án được chấp nhận (mỗi dòng một đáp án)</label><textarea class="form-control" rows="3" th:field="*{acceptedAnswers}"></textarea><div class="form-text">So khớp chính xác sau khi bỏ khoảng trắng thừa và không phân biệt chữ hoa/thường.</div></div>
    <div class="col-12"><label class="form-label">Lời giải / ghi chú đáp án</label><textarea class="form-control" rows="2" th:field="*{explanation}" maxlength="10000"></textarea></div>
    <div class="col-12"><button class="btn btn-primary">Lưu câu hỏi</button><a th:href="@{/teacher/exams/questions}" class="btn btn-link">Làm mới</a></div>
  </form></div></section>
  <section class="card border-0 shadow-sm rounded-4"><div class="card-header bg-white fw-semibold">Câu hỏi của tôi</div><form method="get" th:action="@{/teacher/exams/questions}" class="row g-2 p-3"><div class="col-md-2"><select class="form-select" name="subjectId"><option value="">Mọi môn</option><option th:each="s : ${subjects}" th:value="${s.id}" th:selected="${filterSubjectId == s.id}" th:text="${s.name}"></option></select></div><div class="col-md-2"><select class="form-select" name="gradeLevel"><option value="">Mọi khối</option><option th:each="g : ${#numbers.sequence(6,12)}" th:value="|Lớp ${g}|" th:selected="${filterGradeLevel == 'Lớp ' + g}" th:text="|Lớp ${g}|"></option></select></div><div class="col-md-2"><input class="form-control" name="topic" th:value="${filterTopic}" placeholder="Chủ đề"></div><div class="col-md-2"><select class="form-select" name="questionType"><option value="">Mọi dạng</option><option value="MULTIPLE_CHOICE" th:selected="${filterQuestionType == 'MULTIPLE_CHOICE'}">Trắc nghiệm</option><option value="TRUE_FALSE" th:selected="${filterQuestionType == 'TRUE_FALSE'}">Đúng/Sai</option><option value="FILL_IN" th:selected="${filterQuestionType == 'FILL_IN'}">Điền</option><option value="ESSAY" th:selected="${filterQuestionType == 'ESSAY'}">Tự luận</option></select></div><div class="col-md-2"><select class="form-select" name="difficulty"><option value="">Mọi độ khó</option><option value="EASY" th:selected="${filterDifficulty == 'EASY'}">Dễ</option><option value="MEDIUM" th:selected="${filterDifficulty == 'MEDIUM'}">Trung bình</option><option value="HARD" th:selected="${filterDifficulty == 'HARD'}">Khó</option></select></div><div class="col-md-2"><button class="btn btn-outline-primary">Tìm câu hỏi</button></div></form><div class="table-responsive"><table class="table align-middle mb-0"><thead class="table-light"><tr><th>Nội dung</th><th>Môn / khối</th><th>Chủ đề</th><th>Dạng / độ khó</th><th></th></tr></thead><tbody>
    <tr th:each="q : ${questions}" th:if="${q.active}"><td class="math-content" style="white-space:pre-wrap;max-width:460px" th:text="${q.prompt}"></td><td th:text="|${q.subject.name} · ${q.gradeLevel}|"></td><td th:text="${q.topic != null ? q.topic : '—'}"></td><td th:text="|${q.questionType} · ${q.difficulty}|"></td><td class="text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/teacher/exams/questions/{id}/edit(id=${q.id})}">Sửa</a><form class="d-inline" method="post" th:action="@{/teacher/exams/questions/{id}/archive(id=${q.id})}"><button class="btn btn-sm btn-outline-secondary">Lưu trữ</button></form></td></tr>
    <tr th:if="${#lists.isEmpty(questions)}"><td colspan="5" class="text-secondary text-center py-4">Chưa có câu hỏi.</td></tr>
  </tbody></table></div></section>
</main><script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']}};const typeSelect=document.querySelector('[name="questionType"]');const questionFields=document.querySelectorAll('.question-fields');function syncQuestionFields(){questionFields.forEach(field=>{const hidden=field.dataset.questionType!==typeSelect.value;field.classList.toggle('d-none',hidden);field.querySelectorAll('input,select,textarea').forEach(input=>input.disabled=hidden);});}typeSelect?.addEventListener('change',syncQuestionFields);syncQuestionFields();const promptInput=document.getElementById('questionPrompt');const preview=document.getElementById('formulaPreview');function updatePreview(){preview.textContent=promptInput.value;if(window.MathJax?.typesetPromise){window.MathJax.typesetClear?.([preview]);window.MathJax.typesetPromise([preview]);}}promptInput?.addEventListener('input',updatePreview);</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script></body></html>
