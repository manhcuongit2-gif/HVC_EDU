<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Giao đề thi</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4">
  <a th:href="@{/teacher/exams/blueprints/{id}(id=${blueprint.id})}">← Xem trước đề</a>
  <h1 class="h3 mt-2">Giao đề: <span th:text="${blueprint.title}"></span></h1>
  <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
  <form method="post" th:action="@{/teacher/exams/blueprints/{id}/assign(id=${blueprint.id})}" th:object="${form}" class="card border-0 shadow-sm rounded-4">
    <div class="card-body row g-3">
      <div class="col-12" th:if="${blueprint.scope != null and !blueprint.scope.isBlank()}"><div class="alert alert-info mb-0"><strong>Phạm vi:</strong> <span th:text="${blueprint.scope}"></span></div></div>
      <div class="col-md-6"><label class="form-label">Lớp (đúng môn)</label><select class="form-select" th:field="*{classId}" required><option value="">Chọn lớp</option><option th:each="c : ${classes}" th:value="${c.id}" th:text="|${c.name} · ${c.subject.name}|"></option></select></div>
      <div class="col-md-3"><label class="form-label">Mở đề</label><input class="form-control" type="datetime-local" th:field="*{opensAt}" required></div>
      <div class="col-md-3"><label class="form-label">Đóng đề</label><input class="form-control" type="datetime-local" th:field="*{closesAt}" required></div>
      <div class="col-md-3"><label class="form-label">Thời lượng (phút)</label><input class="form-control" type="number" min="1" max="240" th:field="*{durationMinutes}" required></div>
      <div class="col-md-3"><label class="form-label">Số lượt tối đa</label><input class="form-control" type="number" min="1" max="10" th:field="*{maxAttempts}" required></div>
      <div class="col-md-3 form-check mt-5 ms-3"><input class="form-check-input" type="checkbox" th:field="*{shuffleQuestions}"><label class="form-check-label">Đảo thứ tự câu</label></div>
      <div class="col-md-3 form-check mt-5"><input class="form-check-input" type="checkbox" th:field="*{shuffleOptions}"><label class="form-check-label">Đảo thứ tự đáp án</label></div>
      <div class="col-12"><div class="alert alert-info small">Hạn mỗi lượt được máy chủ tính bằng giờ sớm hơn giữa thời lượng bài làm và giờ đóng đề. Kết quả chỉ công bố sau khi đề đóng và giáo viên chấm xong câu tự luận.</div><button class="btn btn-primary">Giao đề</button></div>
    </div>
  </form>
</main></body></html>
