<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chấm bài thi</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4"><a th:href="@{/teacher/exams/assignments/{id}(id=${assignment.id})}">← Kết quả đề</a><h1 class="h3 mt-2">Bài thi · <span th:text="${attempt.student.fullName}"></span></h1><p class="text-secondary" th:text="|Lượt ${attempt.attemptNumber} · ${attempt.status} · ${attempt.totalScore != null ? attempt.totalScore : 'Chờ chấm'}|"></p><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
<article th:each="q : ${attempt.questions}" class="card border-0 shadow-sm rounded-4 mb-3"><div class="card-body"><div class="d-flex justify-content-between"><strong th:text="|Câu ${q.questionNumber + 1} · ${q.type}|"></strong><span th:text="|${q.score != null ? q.score : '—'} / ${q.points} điểm|"></span></div><div class="math-content my-2" style="white-space:pre-wrap" th:text="${q.prompt}"></div><div th:each="o : ${q.options}" class="small" th:text="|${o.key}. ${o.text}|"></div><div class="border rounded p-2 bg-light mt-2"><strong>Bài làm:</strong> <span style="white-space:pre-wrap" th:text="${q.selectedOptionKey != null ? q.selectedOptionKey : (q.answerText != null ? q.answerText : 'Bỏ trống')}"></span></div><div class="small mt-2" th:if="${q.type != 'ESSAY'}"><strong>Đáp án chuẩn:</strong> <span th:text="${q.expectedAnswer != null && !q.expectedAnswer.isBlank() ? q.expectedAnswer : '—'}"></span><span th:if="${q.correct != null}" th:text="${q.correct ? ' · Đúng' : ' · Sai'}"></span></div><form th:if="${q.type == 'ESSAY'}" class="row g-2 mt-2" method="post" th:action="@{/teacher/exams/assignments/{id}/attempts/{attemptId}/questions/{number}/grade(id=${assignment.id},attemptId=${attempt.id},number=${q.questionNumber})}"><div class="col-sm-3"><label class="form-label">Điểm (0–<span th:text="${q.points}"></span>)</label><input class="form-control" type="number" min="0" step="0.01" th:max="${q.points}" name="score" th:value="${q.score}" required></div><div class="col-sm-9"><label class="form-label">Nhận xét</label><input class="form-control" name="feedback" maxlength="1000" th:value="${q.feedback}"></div><div class="col-12"><button class="btn btn-sm btn-primary">Lưu điểm tự luận</button></div></form></div></article><script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script></main></body></html>
