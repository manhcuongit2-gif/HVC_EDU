<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đề nháp cũ</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><div><h1 class="h3">Đề nháp cũ</h1><p class="text-secondary mb-0">Các bản nháp ma trận đã lưu trước đây vẫn được giữ nguyên.</p></div><a class="btn btn-primary" th:href="@{/teacher/exams/create}">Tạo đề thi</a></div>
  <section class="card border-0 shadow-sm rounded-4"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Đề</th><th>Môn / khối</th><th>Thời lượng</th><th>Tổng điểm</th><th></th></tr></thead><tbody>
    <tr th:each="b : ${blueprints}"><td th:text="${b.title}"></td><td th:text="|${b.subject.name} · ${b.gradeLevel}|"></td><td th:text="|${b.durationMinutes} phút|"></td><td th:text="${b.totalPoints}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/teacher/exams/blueprints/{id}(id=${b.id})}">Xem trước</a></td></tr>
    <tr th:if="${#lists.isEmpty(blueprints)}"><td colspan="5" class="text-center text-secondary py-4">Chưa có đề nháp cũ.</td></tr>
  </tbody></table></div></section>
</main></body></html>
