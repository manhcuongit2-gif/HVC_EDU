<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tạo đề PDF</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4">
  <a th:href="@{/teacher/exams/create}">← Chọn loại đề</a><h1 class="h3 mt-2">Tạo đề PDF</h1>
  <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
  <form class="card border-0 shadow-sm rounded-4" method="post" enctype="multipart/form-data" th:action="@{/teacher/exams/create/pdf}">
    <div class="card-body row g-3">
      <div class="col-12"><label class="form-label" for="pdf">Tệp đề thi PDF</label><input class="form-control" id="pdf" name="pdf" type="file" accept="application/pdf,.pdf" required><div class="form-text">Chỉ nhận PDF tối đa 20 MB. Tệp được lưu riêng tư trên máy chủ.</div></div>
      <div class="col-md-6"><label class="form-label" for="title">Tên đề (có thể để trống)</label><input class="form-control" id="title" name="title" maxlength="150" th:value="${title}" placeholder="Mặc định dùng tên tệp"></div>
      <div class="col-md-6"><label class="form-label" for="classId">Lớp được giao</label><select class="form-select" id="classId" name="classId" required><option value="">Chọn lớp</option><option th:each="c : ${classes}" th:value="${c.id}" th:selected="${classId != null and classId == c.id}" th:text="|${c.name} · ${c.subject.name}|"></option></select></div>
      <div class="col-md-6"><label class="form-label" for="closesAt">Hạn làm bài</label><input class="form-control" id="closesAt" name="closesAt" type="datetime-local" th:value="${dueAtText}" required></div>
      <div class="col-12"><div class="alert alert-info mb-0">Đề PDF chấm thủ công theo thang 0–10. Học sinh có thể nộp lại ảnh trước hạn khi bài chưa được chấm.</div></div>
      <div class="col-12"><button class="btn btn-primary">Tải lên và giao đề PDF</button></div>
    </div>
  </form>
</main></body></html>
