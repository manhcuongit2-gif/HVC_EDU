<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đề PDF</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4">
  <a th:href="@{/teacher/exams/assignments}">← Đề đã giao</a><div class="d-flex justify-content-between align-items-start mt-2"><div><h1 class="h3" th:text="${assignment.title}"></h1><p class="text-secondary" th:text="|${assignment.classEntity.name} · ${assignment.classEntity.subject.name} · Hạn ${#temporals.format(assignment.closesAt,'dd/MM/yyyy HH:mm')} · Thang điểm 0–10|"></p></div><a class="btn btn-outline-primary" target="_blank" th:href="@{/teacher/exams/assignments/{id}/pdf(id=${assignment.id})}">Mở PDF</a></div>
  <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
  <section class="card border-0 shadow-sm rounded-4 mb-4"><div class="card-header bg-white fw-semibold">Đề thi PDF</div><div class="ratio" style="--bs-aspect-ratio: 90%"><iframe title="Đề thi PDF" th:src="@{/teacher/exams/assignments/{id}/pdf(id=${assignment.id})}"></iframe></div></section>
  <section class="card border-0 shadow-sm rounded-4"><div class="card-header bg-white fw-semibold">Bài làm học sinh</div><div class="card-body">
    <div th:if="${#lists.isEmpty(submissions)}" class="text-secondary">Chưa có bài nộp.</div>
    <article th:each="row : ${submissions}" class="border rounded-3 p-3 mb-3">
      <div class="d-flex flex-wrap justify-content-between gap-2"><div><h2 class="h6 mb-1" th:text="${row.student.fullName}"></h2><div class="small text-secondary" th:text="|Phiên bản ${row.submission.versionNumber} · ${#temporals.format(row.submission.submittedAt,'dd/MM/yyyy HH:mm')} · ${row.submission.status == 'PENDING' ? 'Chờ chấm' : (row.submission.status == 'GRADED' ? 'Đã chấm' : 'Phiên bản cũ')}|"></div></div><div th:if="${row.submission.status == 'GRADED'}" class="fw-semibold" th:text="|${row.submission.score} / 10|"></div></div>
      <div class="d-flex flex-wrap gap-2 mt-3"><a th:each="file : ${row.submission.files}" class="border rounded bg-light p-2 text-center" target="_blank" th:href="@{/teacher/exams/assignments/{id}/pdf-submission-files/{fileId}(id=${assignment.id},fileId=${file.id})}"><img th:src="@{/teacher/exams/assignments/{id}/pdf-submission-files/{fileId}(id=${assignment.id},fileId=${file.id})}" th:alt="${file.originalFilename}" style="max-width:240px;max-height:320px;object-fit:contain"><span class="small d-block" th:text="${file.originalFilename}"></span></a></div>
      <p th:if="${row.submission.feedback != null}" class="small mt-2 mb-0" th:text="|Nhận xét: ${row.submission.feedback}|"></p>
      <form th:if="${row.submission.status == 'PENDING'}" class="row g-2 mt-2" method="post" th:action="@{/teacher/exams/assignments/{id}/pdf-submissions/{submissionId}/grade(id=${assignment.id},submissionId=${row.submission.id})}">
        <div class="col-sm-3"><label class="form-label">Điểm (0–10)</label><input class="form-control" name="score" type="number" min="0" max="10" step="0.01" required></div>
        <div class="col-sm-7"><label class="form-label">Nhận xét</label><input class="form-control" name="feedback" maxlength="1000"></div><div class="col-sm-2 d-flex align-items-end"><button class="btn btn-primary">Lưu điểm</button></div>
      </form>
    </article>
  </div></section>
</main></body></html>
