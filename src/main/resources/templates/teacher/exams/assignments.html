<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đề đã giao</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><div><h1 class="h3">Đề đã giao</h1><p class="text-secondary mb-0">Theo dõi bài làm, chấm điểm và xem kết quả.</p></div><div class="d-flex gap-2"><a class="btn btn-primary" th:href="@{/teacher/exams/create}">Tạo đề thi</a><a class="btn btn-outline-primary" th:href="@{/teacher/exams/questions}">Ngân hàng câu hỏi</a></div></div>
  <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
  <section class="card border-0 shadow-sm rounded-4"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Đề</th><th>Hình thức</th><th>Lớp / môn</th><th>Mở – hạn</th><th>Điểm tối đa</th><th>Trạng thái</th></tr></thead><tbody>
    <tr th:each="a : ${assignments}"><td th:text="${a.title}"></td><td><span class="badge text-bg-secondary" th:text="${a.pdfExam ? 'PDF' : 'Trực tuyến'}"></span></td><td th:text="|${a.classEntity.name} · ${a.classEntity.subject.name}|"></td><td th:text="|${#temporals.format(a.opensAt,'dd/MM HH:mm')} – ${#temporals.format(a.closesAt,'dd/MM HH:mm')}|"></td><td th:text="${a.totalPoints}"></td><td><span th:if="${!a.pdfExam}" th:text="${a.resultPublishedAt != null ? 'Đã công bố' : 'Chưa công bố'}"></span><span th:if="${a.pdfExam}">Chấm thủ công</span> · <a th:href="@{/teacher/exams/assignments/{id}(id=${a.id})}">Chi tiết</a></td></tr>
    <tr th:if="${#lists.isEmpty(assignments)}"><td colspan="6" class="text-center text-secondary py-4">Chưa giao đề thi.</td></tr>
  </tbody></table></div></section>
</main></body></html>
