<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sửa hồ sơ học sinh · EduCenter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-4" style="max-width: 760px">
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
        <h1 class="h4 mb-1">Cập nhật hồ sơ học sinh</h1><p class="text-muted" th:text="${classEntity.name}"></p>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <form method="post" th:action="@{/teacher/classes/{classId}/students/{studentId}/edit(classId=${classEntity.id},studentId=${student.id})}">
            <div class="mb-3"><label class="form-label">Họ tên</label><input class="form-control" name="fullName" th:value="${studentForm.fullName}" required maxlength="100"></div>
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label">Ngày sinh</label><input class="form-control" type="date" name="dateOfBirth" th:value="${studentForm.dateOfBirth}"></div>
                <div class="col-md-6"><label class="form-label">Giới tính</label><input class="form-control" name="gender" th:value="${studentForm.gender}"></div>
                <div class="col-md-6"><label class="form-label">Số điện thoại</label><input class="form-control" name="phone" th:value="${studentForm.phone}"></div>
                <div class="col-md-6"><label class="form-label">Khối/lớp</label><input class="form-control" name="gradeLevel" th:value="${studentForm.gradeLevel}"></div>
                <div class="col-md-12"><label class="form-label">Trường</label><input class="form-control" name="school" th:value="${studentForm.school}"></div>
            </div>
            <p class="small text-muted mt-3">Thông tin phụ huynh do admin quản lý.</p>
            <div class="d-flex gap-2 mt-3"><button class="btn btn-primary" type="submit">Lưu thay đổi</button><a class="btn btn-outline-secondary" th:href="@{/teacher/classes/{id}/students(id=${classEntity.id})}">Hủy</a></div>
        </form>
    </div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
