<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý học sinh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 border-bottom pb-3 mb-4">
        <div><h1 class="h3 mb-1">Quản lý học sinh</h1><p class="text-muted mb-0">Danh sách được chia theo các lớp thầy/cô đang phụ trách.</p></div>
        <a th:href="@{/teacher/classes}" class="btn btn-outline-secondary">Danh sách lớp</a>
    </div>
    <div th:unless="${canManageStudents}" class="alert alert-warning">
        Tài khoản chưa được admin cấp quyền quản lý học sinh. Thầy/cô vẫn có thể xem danh sách lớp được phân công.
    </div>
    <div th:if="${canManageStudents and #lists.isEmpty(classes)}" class="alert alert-info">Hiện chưa có lớp nào được phân công.</div>
    <div th:if="${canManageStudents}" class="row g-3">
        <div th:each="c : ${classes}" class="col-md-6 col-xl-4">
            <article class="card h-100 border-0 shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start gap-2">
                        <div><span class="badge text-bg-primary mb-2" th:text="${c.subject.name}">Môn học</span><h2 class="h5" th:text="${c.name}">Tên lớp</h2></div>
                        <span class="badge rounded-pill text-bg-light border" th:text="${studentCounts[c.id]} + ' học sinh'">0 học sinh</span>
                    </div>
                    <p class="text-muted small mb-3" th:text="${c.description != null ? c.description : 'Quản lý danh sách học sinh và thông tin lớp.'}"></p>
                    <a class="btn btn-outline-primary w-100" th:href="@{/teacher/classes/{id}/students(id=${c.id})}"><i class="bi bi-people me-1"></i>Mở danh sách học sinh</a>
                </div>
            </article>
        </div>
    </div>
</main>
</body>
</html>
