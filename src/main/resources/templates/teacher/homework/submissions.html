<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bài nộp · EduCenter</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4">
  <a th:href="@{/teacher/homework}" class="small text-decoration-none">← Bài tập về nhà</a><h1 class="h3 mt-2" th:text="${assignment.title}">Bài tập</h1><p class="text-secondary">Lớp <span th:text="${assignment.classEntity.name}"></span> · hạn <span th:text="${#temporals.format(assignment.dueAt,'HH:mm dd/MM/yyyy')}"></span></p>
  <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
  <div class="row g-3"><div th:each="submission : ${submissions}" class="col-12"><article class="card border-0 shadow-sm rounded-4"><div class="card-body p-4"><div class="d-flex justify-content-between gap-3"><div><h2 class="h5 mb-1" th:text="${submission.student.fullName}"></h2><div class="small text-secondary">Nộp <span th:text="${#temporals.format(submission.submittedAt,'HH:mm dd/MM/yyyy')}"></span><span th:if="${submission.late}" class="badge text-bg-warning ms-2">Nộp muộn</span></div></div><a class="btn btn-outline-primary btn-sm align-self-start" th:href="@{/teacher/homework/{id}/submissions/{submissionId}/file(id=${assignment.id},submissionId=${submission.id})}">Tải bài làm</a></div>
    <form class="row g-3 mt-1" th:action="@{/teacher/homework/{id}/submissions/{submissionId}/review(id=${assignment.id},submissionId=${submission.id})}" method="post"><div class="col-sm-3"><label class="form-label">Điểm (0–10)</label><input class="form-control" type="number" name="score" min="0" max="10" step="0.25" th:value="${submission.score}" required></div><div class="col-sm-9"><label class="form-label">Nhận xét</label><input class="form-control" name="feedback" maxlength="1000" th:value="${submission.feedback}" placeholder="Nhận xét để phụ huynh xem"></div><div class="col-12"><button class="btn btn-primary">Lưu nhận xét</button></div></form>
  </div></article></div><div th:if="${#lists.isEmpty(submissions)}" class="col-12"><div class="alert alert-info">Chưa có học sinh nộp bài.</div></div></div>
</main></body></html>
