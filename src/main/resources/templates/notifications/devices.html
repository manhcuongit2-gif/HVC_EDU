<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Thiết bị nhận thông báo · EduCenter</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></head>
<body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4" style="max-width:800px">
  <a th:href="@{/notifications}" class="small text-decoration-none">← Trung tâm thông báo</a><h1 class="h3 mt-2">Thiết bị nhận thông báo</h1>
  <p id="pushStatus" class="text-secondary">Bật thông báo trên trình duyệt hoặc điện thoại bạn đang sử dụng.</p>
  <button id="enablePushButton" class="btn btn-primary mb-4"><i class="bi bi-bell me-1"></i>Bật trên thiết bị này</button>
  <div class="card border-0 shadow-sm rounded-4"><div class="card-header bg-white fw-semibold py-3">Thiết bị đã đăng ký</div><div id="deviceList" class="list-group list-group-flush"><div class="list-group-item text-secondary">Đang tải danh sách thiết bị…</div></div></div>
</main><script>
const deviceList=document.getElementById('deviceList'); const csrf=document.querySelector('meta[name="csrf-token"]')?.content||document.querySelector('input[name="_csrf"]')?.value||''; const header=document.querySelector('meta[name="csrf-header"]')?.content||'X-CSRF-TOKEN';
fetch('/api/push/subscriptions',{credentials:'same-origin'}).then(r=>r.ok?r.json():[]).then(items=>{deviceList.replaceChildren();if(!items.length){deviceList.innerHTML='<div class="list-group-item text-secondary">Chưa có thiết bị nào bật thông báo.</div>';return;}items.forEach(item=>{const row=document.createElement('div');row.className='list-group-item d-flex justify-content-between align-items-center gap-3';row.dataset.deviceRow='';const label=document.createElement('div');label.innerHTML=`<strong>${escapeHtml(item.name)}</strong><div class="small text-secondary">${escapeHtml(item.platform||'Trình duyệt')} · hoạt động ${escapeHtml(item.lastSeenAt||'')}</div>`;const button=document.createElement('button');button.className='btn btn-sm btn-outline-danger';button.textContent='Gỡ thiết bị';button.dataset.removeDevice=item.id;button.onclick=async()=>{const res=await fetch(`/api/push/subscriptions/${item.id}`,{method:'DELETE',credentials:'same-origin',headers:{[header]:csrf}});if(res.ok)row.remove();};row.append(label,button);deviceList.append(row);});}).catch(()=>{deviceList.innerHTML='<div class="list-group-item text-danger">Không tải được danh sách thiết bị.</div>';});
function escapeHtml(value){const node=document.createElement('span');node.textContent=value||'';return node.innerHTML;}
</script></body></html>
