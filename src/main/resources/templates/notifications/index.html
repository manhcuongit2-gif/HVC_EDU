<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Thông báo · EduCenter</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></head>
<body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-4" style="max-width:900px">
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4"><div><h1 class="h3 mb-1">Trung tâm thông báo</h1><p class="text-secondary mb-0">Cập nhật học tập, lớp học và hoạt động tài khoản của bạn.</p></div>
    <div class="d-flex gap-2"><a class="btn btn-outline-primary" th:href="@{/notifications/settings}"><i class="bi bi-sliders me-1"></i>Tùy chỉnh</a><a class="btn btn-outline-secondary" th:href="@{/notifications/devices}"><i class="bi bi-phone me-1"></i>Thiết bị</a></div></div>
  <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
  <section class="card border-0 shadow-sm rounded-4"><div class="card-header bg-white d-flex justify-content-between align-items-center py-3"><strong>Thông báo của bạn</strong><button id="markAllRead" class="btn btn-sm btn-outline-primary" th:disabled="${unreadCount == 0}">Đánh dấu đã đọc</button></div>
    <div id="notificationList" class="list-group list-group-flush">
      <article th:each="item : ${notifications}" class="list-group-item px-3 px-md-4 py-3" th:classappend="${!item.read} ? ' bg-primary-subtle'" th:attr="data-notification-id=${item.id}">
        <div class="d-flex gap-3"><div class="rounded-circle bg-primary text-white d-grid flex-shrink-0" style="width:42px;height:42px;place-items:center"><i class="bi bi-bell"></i></div><div class="min-w-0 flex-grow-1"><div class="d-flex justify-content-between gap-2"><strong th:text="${item.title}">Thông báo</strong><time class="small text-secondary text-nowrap" th:text="${#temporals.format(item.createdAt,'HH:mm dd/MM/yyyy')}">09:30</time></div><p class="mb-2 text-secondary" th:text="${item.body}">Nội dung thông báo</p><div class="d-flex gap-3"><a class="small text-decoration-none" th:href="${item.targetPath}" th:text="${item.targetPath == '/notifications' ? 'Xem chi tiết' : 'Mở nội dung'}">Mở</a><button th:if="${!item.read}" class="btn btn-link btn-sm p-0 text-decoration-none" data-mark-read>Đánh dấu đã đọc</button><button class="btn btn-link btn-sm p-0 text-secondary text-decoration-none" data-hide>Ẩn</button></div></div></div>
      </article>
      <div th:if="${#lists.isEmpty(notifications)}" id="emptyNotifications" class="text-center text-secondary py-5"><i class="bi bi-bell-slash fs-1 d-block mb-2"></i>Bạn chưa có thông báo nào.</div>
    </div></section>
</main>
<script>
const csrf=document.querySelector('meta[name="csrf-token"]')?.content||document.querySelector('input[name="_csrf"]')?.value||''; const csrfHeader=document.querySelector('meta[name="csrf-header"]')?.content||'X-CSRF-TOKEN';
const post=(url,method='POST')=>fetch(url,{method,credentials:'same-origin',headers:{[csrfHeader]:csrf}});
document.querySelectorAll('[data-mark-read]').forEach(b=>b.addEventListener('click',async()=>{const row=b.closest('[data-notification-id]');if((await post(`/api/business-notifications/${row.dataset.notificationId}/read`)).ok){row.classList.remove('bg-primary-subtle');b.remove();}}));
document.querySelectorAll('[data-hide]').forEach(b=>b.addEventListener('click',async()=>{const row=b.closest('[data-notification-id]');if((await post(`/api/business-notifications/${row.dataset.notificationId}`,'DELETE')).ok)row.remove();}));
document.getElementById('markAllRead')?.addEventListener('click',async()=>{if((await post('/api/business-notifications/read-all')).ok)location.reload();});
</script></body></html>
