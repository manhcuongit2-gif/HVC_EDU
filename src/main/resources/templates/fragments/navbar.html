<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body>
<th:block th:fragment="navbar">
<style>
    .message-notification { position: relative; }
    .message-notification-menu { position: absolute; z-index: 1050; top: calc(100% + .5rem); right: 0; width: min(22rem, calc(100vw - 2rem)); max-height: 22rem; overflow-y: auto; }
    .message-notification-item { white-space: normal; }
    .navbar-account-chip { display:flex; align-items:center; gap:.55rem; color:#fff; text-decoration:none; min-width:0; }
    .navbar-account-chip:hover { color:#fff; opacity:.9; }
    .navbar-account-avatar { display:grid; width:2rem; height:2rem; flex:0 0 2rem; place-items:center; overflow:hidden; border-radius:50%; background:#fff; color:#155eef; font-weight:700; }
    .navbar-account-avatar img { width:100%; height:100%; object-fit:cover; }
    .navbar-actions { display:flex; align-items:center; justify-content:flex-end; gap:.5rem !important; flex-wrap:wrap; min-width:0; }
    .business-toast-region { position:fixed; z-index:1080; top:1rem; right:1rem; width:min(23rem,calc(100vw - 2rem)); display:grid; gap:.65rem; pointer-events:none; }
    .business-toast { pointer-events:auto; border:0; border-left:.28rem solid var(--toast-accent,#155eef); border-radius:.9rem; box-shadow:0 .75rem 2rem rgba(15,35,65,.2); }
    .business-toast .toast-body { overflow-wrap:anywhere; }
    .ai-floating-launcher {
        position: fixed;
        right: 1.5rem;
        bottom: 1.5rem;
        z-index: 1040;
        display: grid;
        width: 3.75rem;
        height: 3.75rem;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, .7);
        border-radius: 50%;
        background: linear-gradient(145deg, #2677f5, #1246c5);
        box-shadow: 0 .5rem 1.25rem rgba(17, 62, 154, .35);
        color: #fff;
        font-size: 1.55rem;
        text-decoration: none;
        transition: transform .18s ease, box-shadow .18s ease;
    }
    .ai-floating-launcher:hover { color: #fff; transform: translateY(-3px); box-shadow: 0 .75rem 1.5rem rgba(17, 62, 154, .42); }
    .ai-floating-launcher:focus-visible { outline: 3px solid #ffd166; outline-offset: 3px; }
    @media (max-width: 575.98px) {
        .navbar .container-fluid { padding-left:.65rem !important; padding-right:.65rem !important; align-items:flex-start; }
        .navbar-brand { font-size:.82rem; margin-right:.5rem; }
        .navbar-actions { flex:1 1 auto; gap:.35rem !important; }
        .navbar-actions > * { flex-shrink:0; }
        .ai-floating-launcher { right: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom)); width: 3.5rem; height: 3.5rem; }
        .business-toast-region { top:auto; right:.75rem; bottom:calc(.75rem + env(safe-area-inset-bottom)); width:calc(100vw - 1.5rem); }
    }
</style>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold d-flex align-items-center" th:href="@{/}">
            <i class="bi bi-mortarboard-fill fs-4 me-2"></i>
            <span>LUYỆN THI HÙNG CƯỜNG</span>
        </a>

        <div class="navbar-actions">
            <button th:if="${currentUser != null and currentUser.roleName == 'ROLE_ADMIN'}" id="adminMenuToggle" type="button" class="btn btn-outline-light btn-sm d-md-none" aria-controls="adminSidebar" aria-expanded="false"><i class="bi bi-list fs-5" aria-hidden="true"></i><span class="visually-hidden">Mở menu quản trị</span></button>
            <a class="btn btn-outline-light btn-sm" th:href="@{/}" title="Về trang chính" aria-label="Về trang chính"><i class="bi bi-house-door-fill"></i><span class="d-none d-md-inline ms-1">Trang chính</span></a>
            <a th:if="${currentUser != null and currentUser.roleName == 'ROLE_TEACHER'}" class="btn btn-outline-light btn-sm" th:href="@{/teacher/homework}"><i class="bi bi-journal-check me-1"></i><span class="d-none d-md-inline">Bài tập</span></a>
            <a th:if="${currentUser != null and currentUser.roleName == 'ROLE_TEACHER'}" class="btn btn-outline-light btn-sm" th:href="@{/teacher/exams}"><i class="bi bi-ui-checks-grid me-1"></i><span class="d-none d-md-inline">Đề thi</span></a>
            <a th:if="${currentUser != null and currentUser.roleName == 'ROLE_PARENT'}" class="btn btn-outline-light btn-sm" th:href="@{/parent/homework}"><i class="bi bi-journal-check me-1"></i><span class="d-none d-md-inline">Bài tập của con</span></a>
            <a th:if="${currentUser != null and currentUser.roleName == 'ROLE_PARENT'}" class="btn btn-outline-light btn-sm" th:href="@{/parent/exams}"><i class="bi bi-award me-1"></i><span class="d-none d-md-inline">Kết quả thi</span></a>
            <a th:if="${currentUser != null and currentUser.roleName == 'ROLE_STUDENT'}" class="btn btn-outline-light btn-sm" th:href="@{/student/homework}"><i class="bi bi-journal-check me-1"></i><span class="d-none d-md-inline">Bài tập</span></a>
            <a th:if="${currentUser != null and currentUser.roleName == 'ROLE_STUDENT'}" class="btn btn-outline-light btn-sm" th:href="@{/student/exams}"><i class="bi bi-ui-checks-grid me-1"></i><span class="d-none d-md-inline">Bài thi</span></a>
            <a th:if="${currentUser != null and currentUser.roleName == 'ROLE_STUDENT'}" class="btn btn-outline-light btn-sm" th:href="@{/student/progress}"><i class="bi bi-graph-up me-1"></i><span class="d-none d-md-inline">Tiến độ</span></a>
            <a th:if="${currentUser != null and currentUser.roleName == 'ROLE_STUDENT'}" class="btn btn-outline-light btn-sm" th:href="@{/student/ai}"><i class="bi bi-stars me-1"></i><span class="d-none d-md-inline">Học cùng AI</span></a>
            <a th:if="${currentUser != null}" class="btn btn-outline-light btn-sm" th:href="@{/account/settings}" title="Cài đặt tài khoản"><i class="bi bi-person-gear me-1"></i><span class="d-none d-md-inline">Tài khoản</span></a>
            <a class="btn btn-outline-light btn-sm position-relative" th:href="@{/notifications}" title="Trung tâm thông báo">
                <i class="bi bi-bell me-1"></i><span class="d-none d-md-inline">Thông báo</span>
                <span id="businessNotificationCount" class="badge rounded-pill bg-warning text-dark d-none">0</span>
            </a>
            <button id="installAppButton" type="button" class="btn btn-outline-light btn-sm d-none"><i class="bi bi-download me-1"></i><span class="d-none d-md-inline">Cài ứng dụng</span></button>
            <a th:if="${currentUser != null and currentUser.roleName != 'ROLE_STUDENT'}" class="btn btn-outline-light btn-sm" th:href="@{/chat}" title="Mở hộp thư"><i class="bi bi-chat-dots me-1"></i><span class="d-none d-md-inline">Tin nhắn</span></a>
            <div class="message-notification" th:if="${currentUser != null and currentUser.roleName != 'ROLE_STUDENT'}">
                <button type="button" id="messageNotificationButton" class="btn btn-outline-light btn-sm position-relative"
                        aria-expanded="false" aria-controls="messageNotificationMenu">
                    <i class="bi bi-chat-left-text me-1"></i><span class="d-none d-md-inline">Tin nhắn mới</span>
                    <span id="messageNotificationCount" class="badge rounded-pill bg-danger d-none">0</span>
                </button>
                <div id="messageNotificationMenu" class="message-notification-menu card shadow d-none">
                    <div class="card-header bg-white fw-semibold">Tin nhắn mới</div>
                    <div id="messageNotificationItems" class="list-group list-group-flush">
                        <div class="list-group-item small text-muted">Đang tải thông báo...</div>
                    </div>
                </div>
            </div>
            <a th:if="${currentUser != null and (currentUser.roleName == 'ROLE_STUDENT' or currentUser.roleName == 'ROLE_PARENT' or currentUser.roleName == 'ROLE_TEACHER')}" class="navbar-account-chip d-flex" th:href="@{/account/settings}" title="Mở tài khoản">
                <span class="navbar-account-avatar"><img th:if="${currentUser.user.avatarFilename != null}" th:src="@{/account/avatar}" alt=""><span th:unless="${currentUser.user.avatarFilename != null}" th:text="${#strings.substring(currentUser.fullName,0,1)}">U</span></span>
                <span class="text-end d-none d-lg-block"><span class="fw-semibold small d-block" th:text="${currentUser.fullName}">Họ tên</span><span class="badge bg-light text-primary small" th:text="${currentUser.roleName == 'ROLE_TEACHER' ? 'NGƯỜI DẠY' : (currentUser.roleName == 'ROLE_PARENT' ? 'PHỤ HUYNH' : 'HỌC SINH')}">ROLE</span></span>
            </a>
            <div class="text-white text-end d-none d-sm-block" th:if="${currentUser == null or currentUser.roleName == 'ROLE_ADMIN'}">
                <div class="fw-semibold small" th:text="${currentUser != null ? currentUser.fullName : 'Người dùng'}">Họ tên</div>
                <span class="badge bg-light text-primary small" th:text="${currentUser == null ? 'USER' : (currentUser.roleName == 'ROLE_TEACHER' ? 'NGƯỜI DẠY' : (currentUser.roleName == 'ROLE_PARENT' ? 'PHỤ HUYNH' : (currentUser.roleName == 'ROLE_STUDENT' ? 'HỌC SINH' : (currentUser.roleName == 'ROLE_ADMIN' ? 'QUẢN TRỊ VIÊN' : currentUser.roleName))))}">ROLE</span>
            </div>

            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-light btn-sm d-flex align-items-center">
                    <i class="bi bi-box-arrow-right me-1"></i> Đăng xuất
                </button>
            </form>
        </div>
    </div>
</nav>
<a th:if="${currentUser != null and (currentUser.roleName == 'ROLE_ADMIN' or currentUser.roleName == 'ROLE_TEACHER' or currentUser.roleName == 'ROLE_PARENT')}"
   class="ai-floating-launcher" th:href="@{/ai}" title="Mở Hùng Cường AI" aria-label="Mở Hùng Cường AI">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true" focusable="false">
        <path d="m12 2 2.15 6.55L21 11l-6.85 2.45L12 20l-2.15-6.55L3 11l6.85-2.45L12 2Zm7 12 1.05 3.05L23 18l-2.95.95L19 22l-1.05-3.05L15 18l2.95-.95L19 14ZM5 2l.72 2.28L8 5l-2.28.72L5 8l-.72-2.28L2 5l2.28-.72L5 2Z" />
    </svg>
</a>
<a th:if="${currentUser != null and currentUser.roleName == 'ROLE_STUDENT'}"
   class="ai-floating-launcher" th:href="@{/student/ai}" title="Mở Hùng Cường AI" aria-label="Mở Hùng Cường AI">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true" focusable="false">
        <path d="m12 2 2.15 6.55L21 11l-6.85 2.45L12 20l-2.15-6.55L3 11l6.85-2.45L12 2Zm7 12 1.05 3.05L23 18l-2.95.95L19 22l-1.05-3.05L15 18l2.95-.95L19 14ZM5 2l.72 2.28L8 5l-2.28.72L5 8l-.72-2.28L2 5l2.28-.72L5 2Z" />
    </svg>
</a>
<div th:if="${currentUser != null}" id="businessToastRegion" class="business-toast-region" aria-live="polite" aria-atomic="false"
     th:attr="data-csrf-token=${_csrf != null ? _csrf.token : ''},data-csrf-header=${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}"></div>
<th:block th:if="${currentUser != null}">
    <script src="/webjars/github-com-stomp-js-stompjs/7.0.0/bundles/stomp.umd.min.js" defer></script>
    <script src="/js/business-notifications.js" defer></script>
</th:block>
<script src="/js/pwa.js" defer></script>
<script>
    (() => {
        const button = document.getElementById('messageNotificationButton');
        const menu = document.getElementById('messageNotificationMenu');
        const count = document.getElementById('messageNotificationCount');
        const items = document.getElementById('messageNotificationItems');
        if (!button || !menu || !count || !items) return;

        button.addEventListener('click', () => {
            const opening = menu.classList.contains('d-none');
            menu.classList.toggle('d-none', !opening);
            button.setAttribute('aria-expanded', String(opening));
        });

        const render = (data) => {
            const unreadCount = Number(data.unreadCount || 0);
            count.textContent = unreadCount > 99 ? '99+' : String(unreadCount);
            count.classList.toggle('d-none', unreadCount === 0);
            items.replaceChildren();

            if (!data.items || data.items.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'list-group-item small text-muted';
                empty.textContent = 'Bạn không có tin nhắn mới.';
                items.append(empty);
                return;
            }

            data.items.forEach((notification) => {
                const link = document.createElement('a');
                link.className = 'list-group-item list-group-item-action message-notification-item';
                link.href = notification.conversationUrl;
                const sender = document.createElement('strong');
                sender.className = 'd-block';
                sender.textContent = `Tin mới từ ${notification.senderName}`;
                const preview = document.createElement('span');
                preview.className = 'small text-muted';
                preview.textContent = notification.preview;
                link.append(sender, preview);
                items.append(link);
            });
        };

        const refresh = () => fetch('/api/notifications', { headers: { Accept: 'application/json' }, credentials: 'same-origin' })
            .then((response) => response.ok ? response.json() : Promise.reject(new Error('Notification request failed')))
            .then(render)
            .catch(() => {});

        refresh();
        window.setInterval(refresh, 8000);
    })();
</script>
</th:block>
</body>
</html>
