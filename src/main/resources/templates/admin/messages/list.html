<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Trao đổi với người dạy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}"><link rel="stylesheet" th:href="@{/css/messages.css}">
</head>
<body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div><div class="container-fluid"><div class="row">
    <div th:replace="~{fragments/sidebar-admin :: sidebar('messages')}"></div>
    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3"><div><h1 class="h3">Trao đổi với người dạy</h1><p class="text-muted mb-0">Hội thoại riêng giữa tài khoản admin chính và người dạy.</p></div><a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary">Dashboard</a></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <div th:if="${#lists.isEmpty(teachers)}" class="alert alert-info">Chưa có tài khoản người dạy đang hoạt động.</div>
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden message-inbox"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th>Người dạy</th><th>Email</th><th>Chuyên môn</th><th></th></tr></thead>
            <tbody><tr th:each="teacher : ${teachers}">
                <td th:text="${teacher.user.fullName}"></td><td th:text="${teacher.user.email}"></td>
                <td th:text="${teacher.specialization != null ? teacher.specialization : '—'}"></td>
                <td class="text-end"><a class="btn btn-sm btn-primary" th:href="@{/admin/messages/{teacherUserId}(teacherUserId=${teacher.user.id})}">Mở hội thoại</a></td>
            </tr></tbody>
        </table></div></div>
    </main>
</div></div></body></html>
