<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tài liệu các lớp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div><div class="container-fluid"><div class="row"><div th:replace="~{fragments/sidebar-admin :: sidebar('materials')}"></div>
<main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4"><div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3"><div><h1 class="h3">Tài liệu các lớp</h1><p class="text-muted mb-0">Toàn quyền quản lý tài liệu theo lớp.</p></div><a th:href="@{/admin/materials/add}" class="btn btn-primary">Thêm tài liệu</a></div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div th:if="${#lists.isEmpty(materials)}" class="alert alert-info">Chưa có tài liệu.</div>
    <div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>Tài liệu</th><th>Lớp</th><th>Nguồn</th><th>Người đăng</th><th></th></tr></thead><tbody>
        <tr th:each="m : ${materials}"><td><strong th:text="${m.title}"></strong><small class="d-block text-muted" th:if="${m.description != null}" th:text="${m.description}"></small></td><td th:text="${m.classEntity.name}"></td>
            <td><a th:if="${m.storedFilename != null}" th:href="@{/admin/materials/{id}/file(id=${m.id})}" th:text="${m.originalFilename}"></a><a th:if="${m.externalUrl != null}" th:href="${m.externalUrl}" target="_blank" rel="noopener noreferrer">Liên kết</a></td>
            <td th:text="${m.createdBy != null ? m.createdBy.fullName : '—'}"></td><td class="text-end text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/materials/edit/{id}(id=${m.id})}">Sửa</a>
                <form class="d-inline" method="post" th:action="@{/admin/materials/delete/{id}(id=${m.id})}" onsubmit="return confirm('Xóa tài liệu này?')"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></td></tr>
    </tbody></table></div></div>
</main></div></div></body></html>
