<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Báo cáo tháng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
</head>
<body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container-fluid py-4"><div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3"><div><h1 class="h3">Báo cáo tháng</h1><p class="text-muted mb-0">Admin xem báo cáo đã công bố; nội dung chỉ giáo viên phụ trách được sửa.</p></div><a th:href="@{/admin/schedules(month=${month})}" class="btn btn-outline-secondary">Lịch tháng</a></div>
    <form method="get" th:action="@{/admin/schedules/monthly}" class="card card-body border-0 shadow-sm mb-3"><div class="row g-2 align-items-end">
        <div class="col-md-4"><label class="form-label">Tháng</label><input type="month" name="month" class="form-control" th:value="${month}"></div>
        <div class="col-md-6"><label class="form-label">Lớp</label><select class="form-select" name="classId"><option value="">Tất cả lớp</option><option th:each="c : ${classes}" th:value="${c.id}" th:selected="${selectedClassId != null && selectedClassId == c.id}" th:text="${c.name}"></option></select></div>
        <div class="col-md-2"><button class="btn btn-primary w-100">Lọc</button></div>
    </div></form>
    <div class="d-flex justify-content-end gap-2 mb-3"><a class="btn btn-sm btn-outline-success" th:href="@{/admin/schedules/monthly/export(month=${month},classId=${selectedClassId},format='xlsx')}">Xuất Excel</a><a class="btn btn-sm btn-outline-danger" th:href="@{/admin/schedules/monthly/export(month=${month},classId=${selectedClassId},format='pdf')}">Xuất PDF</a></div>
    <div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-striped align-middle mb-0">
        <thead><tr><th>Học sinh</th><th>Lớp</th><th>Có mặt</th><th>Vắng</th><th>Có phép</th><th>TB BTVN</th><th>Lượt tốt</th><th>Nhận xét tháng</th></tr></thead><tbody>
        <tr th:if="${#lists.isEmpty(reports)}"><td colspan="8" class="text-center text-muted py-4">Chưa có báo cáo tháng được công bố.</td></tr>
        <tr th:each="r : ${reports}"><td th:text="${r.student.fullName}"></td><td th:text="${r.classEntity.name}"></td><td th:text="${r.presentCount}"></td><td th:text="${r.absentCount}"></td><td th:text="${r.excusedCount}"></td><td th:text="${r.homeworkAverage != null ? r.homeworkAverage : '—'}"></td><td th:text="${r.goodEvaluationCount}"></td><td style="white-space:pre-line" th:text="${r.teacherComment}"></td></tr>
        </tbody></table></div></div>
</main></body></html>
