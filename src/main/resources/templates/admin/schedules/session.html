<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chi tiết buổi học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-4">
    <a th:href="@{/admin/schedules}" class="btn btn-outline-secondary btn-sm mb-3">← Về lịch tháng</a>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div class="card border-0 shadow-sm mb-3"><div class="card-body">
        <h1 class="h4" th:text="${classSession.classEntity.name}">Lớp</h1>
        <p class="mb-1"><span th:text="${#temporals.format(classSession.sessionDate,'dd/MM/yyyy')}"></span> · <span th:text="|${classSession.startTime} – ${classSession.endTime}|"></span></p>
        <p class="text-muted mb-0">Phòng: <span th:text="${classSession.room != null ? classSession.room.name : 'Chưa có'}"></span> · Giáo viên: <span th:text="${classSession.classEntity.teacher.user.fullName}"></span></p>
        <span th:if="${classSession.status == 'CANCELLED'}" class="badge bg-secondary mt-2">Đã hủy</span>
        <span th:if="${classSession.publishedAt != null}" class="badge bg-success mt-2">Đã công bố báo cáo</span>
        <span th:if="${classSession.publishedAt == null && classSession.status != 'CANCELLED'}" class="badge bg-warning text-dark mt-2">Chưa công bố báo cáo</span>
    </div></div>
    <div class="card border-0 shadow-sm mb-3"><div class="card-header fw-bold">Báo cáo học sinh (chỉ xem)</div><div class="table-responsive">
        <table class="table table-striped align-middle mb-0"><thead><tr><th>Học sinh</th><th>Điểm danh</th><th>BTVN</th><th>Nhận xét</th><th>Lượt tốt</th><th>Ghi chú</th></tr></thead><tbody>
        <tr th:if="${#lists.isEmpty(reports)}"><td colspan="6" class="text-center text-muted py-3">Giáo viên chưa nhập báo cáo.</td></tr>
        <tr th:each="r : ${reports}"><td th:text="${r.student.fullName}"></td><td th:text="${r.attendanceStatus}"></td><td th:text="${r.homeworkScore != null ? r.homeworkScore : '—'}"></td><td th:text="${r.comment}"></td><td th:text="${r.goodEvaluationCount}"></td><td th:text="${r.note != null ? r.note : '—'}"></td></tr>
        </tbody></table>
    </div></div>
    <div th:if="${classSession.status != 'CANCELLED' && classSession.publishedAt == null}" class="card border-0 shadow-sm"><div class="card-header fw-bold">Điều chỉnh buổi chưa có báo cáo</div><div class="card-body">
        <form class="row g-2 align-items-end" method="post" th:action="@{/admin/schedules/session/{id}/reschedule(id=${classSession.id})}">
            <div class="col-md-3"><label class="form-label">Ngày</label><input class="form-control" type="date" name="date" th:value="${classSession.sessionDate}" required></div>
            <div class="col-md-2"><label class="form-label">Bắt đầu</label><input class="form-control" type="time" name="startTime" th:value="${classSession.startTime}" required></div>
            <div class="col-md-2"><label class="form-label">Kết thúc</label><input class="form-control" type="time" name="endTime" th:value="${classSession.endTime}" required></div>
            <div class="col-md-3"><label class="form-label">Phòng</label><select class="form-select" name="roomId" required><option th:each="room : ${rooms}" th:value="${room.id}" th:selected="${classSession.room != null && room.id == classSession.room.id}" th:text="${room.name}"></option></select></div>
            <div class="col-md-2"><button class="btn btn-primary w-100">Đổi lịch</button></div>
        </form>
        <form class="mt-3" method="post" th:action="@{/admin/schedules/session/{id}/cancel(id=${classSession.id})}" onsubmit="return confirm('Hủy buổi học này?')"><button class="btn btn-outline-danger">Hủy buổi</button></form>
    </div></div>
</main></body></html>
