<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Thông báo chung · EduCenter</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/admin-sidebar.css}"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></head>
<body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div><div class="container-fluid"><div class="row"><div th:replace="~{fragments/sidebar-admin :: sidebar('notifications')}"></div>
<main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
  <div class="border-bottom pb-3 mb-4"><h1 class="h3">Thông báo chung</h1><p class="text-secondary mb-0">Gửi hoặc lên lịch thông báo cho các tài khoản trong hệ thống.</p></div>
  <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
  <div class="card border-0 shadow-sm rounded-4 mb-4"><div class="card-body p-4"><h2 class="h5 mb-3">Soạn thông báo</h2><form th:action="@{/admin/notifications}" method="post" class="row g-3">
    <div class="col-md-8"><label class="form-label" for="title">Tiêu đề</label><input class="form-control" id="title" name="title" maxlength="180" required></div>
    <div class="col-md-4"><label class="form-label" for="targetRole">Người nhận</label><select class="form-select" id="targetRole" name="targetRole"><option value="ALL">Tất cả tài khoản</option><option value="ROLE_PARENT">Phụ huynh</option><option value="ROLE_TEACHER">Giáo viên</option><option value="ROLE_ADMIN">Quản trị viên</option></select></div>
    <div class="col-12"><label class="form-label" for="body">Nội dung</label><textarea class="form-control" id="body" name="body" rows="3" maxlength="500" required></textarea></div>
    <div class="col-md-8"><label class="form-label" for="targetPath">Đường dẫn khi mở thông báo</label><input class="form-control" id="targetPath" name="targetPath" value="/notifications" maxlength="2048" placeholder="/notifications"></div>
    <div class="col-md-4"><label class="form-label" for="scheduledAt">Thời điểm gửi (để trống để gửi sớm)</label><input class="form-control" id="scheduledAt" name="scheduledAt" type="datetime-local"></div>
    <div class="col-12"><button class="btn btn-primary"><i class="bi bi-send me-1"></i>Lưu và gửi</button></div>
  </form></div></div>
  <section class="card border-0 shadow-sm rounded-4"><div class="card-header bg-white py-3 fw-semibold">Lịch sử và lịch gửi</div><div class="table-responsive"><table class="table align-middle mb-0"><thead class="table-light"><tr><th>Thông báo</th><th>Người nhận</th><th>Thời điểm</th><th>Trạng thái</th></tr></thead><tbody>
    <tr th:each="item : ${broadcasts}"><td><strong th:text="${item.title}"></strong><div class="small text-secondary" th:text="${item.body}"></div></td><td th:text="${item.targetRole == null ? 'Tất cả tài khoản' : (item.targetRole == 'ROLE_PARENT' ? 'Phụ huynh' : (item.targetRole == 'ROLE_TEACHER' ? 'Giáo viên' : 'Quản trị viên'))}"></td><td th:text="${#temporals.format(item.scheduledAt,'HH:mm dd/MM/yyyy')}"></td><td><span class="badge" th:classappend="${item.status == 'SENT' ? ' bg-success' : (item.status == 'FAILED' ? ' bg-danger' : ' bg-warning text-dark')}" th:text="${item.status == 'SENT' ? 'Đã gửi' : (item.status == 'FAILED' ? 'Lỗi' : 'Đang chờ')}"></span><div th:if="${item.lastError != null}" class="small text-danger" th:text="${item.lastError}"></div></td></tr>
    <tr th:if="${#lists.isEmpty(broadcasts)}"><td colspan="4" class="text-center text-secondary py-4">Chưa có thông báo nào.</td></tr>
  </tbody></table></div></section>
</main></div></div></body></html>
