<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Trung tâm Học thêm Luyện Thi Hùng Cường</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root { --school-navy: #14365d; --school-blue: #2878c8; --school-gold: #efbd52; --school-paper: #fffdf7; }
        body {
            background:
                radial-gradient(circle at 12% 16%, rgba(239, 189, 82, .22), transparent 24rem),
                radial-gradient(circle at 88% 82%, rgba(40, 120, 200, .2), transparent 26rem),
                url('/images/classroom-study.svg') right 4vw bottom 1rem / min(52vw, 760px) auto no-repeat,
                linear-gradient(135deg, #e9f1f8 0%, #f6f3e9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            overflow-x: hidden;
        }
        .login-stage { position: relative; width: min(940px, 100%); display: flex; justify-content: center; isolation: isolate; }
        .school-art { position: absolute; z-index: -1; color: #14365d; opacity: .74; filter: drop-shadow(0 12px 18px rgba(20,54,93,.12)); }
        .school-art i { display: block; }
        .school-art.books { left: 3%; bottom: 6%; transform: rotate(-9deg); font-size: 5.4rem; }
        .school-art.pencil { right: 6%; top: 9%; transform: rotate(27deg); color: #d99726; font-size: 4rem; }
        .school-art.chalkboard { right: 0; bottom: 10%; color: #2a705a; transform: rotate(5deg); font-size: 4.6rem; }
        .school-art.cap { left: 7%; top: 7%; color: #d6a73d; transform: rotate(-12deg); font-size: 3.8rem; }
        .login-card {
            position: relative;
            z-index: 1;
            background: var(--school-paper);
            border: 1px solid rgba(20, 54, 93, .12);
            border-radius: 20px;
            box-shadow: 0 22px 55px rgba(20, 54, 93, .18);
            overflow: hidden;
            max-width: 470px;
            width: 100%;
        }
        .login-card::before {
            content: "";
            position: absolute;
            top: -16px;
            right: 26px;
            width: 54px;
            height: 30px;
            border-radius: 4px;
            background: linear-gradient(135deg, #f0c75e, #ffe9ad);
            transform: rotate(8deg);
            opacity: .95;
        }
        .login-header {
            position: relative;
            isolation: isolate;
            background: linear-gradient(135deg, #14365d 0%, #205e9b 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .login-header::after {
            content: "";
            position: absolute;
            z-index: -1;
            inset: 0;
            opacity: .13;
            background: radial-gradient(circle at 14% 24%, rgba(255,255,255,.35) 0 2px, transparent 3px),
                        radial-gradient(circle at 78% 68%, rgba(255,255,255,.26) 0 3px, transparent 4px),
                        radial-gradient(ellipse at 84% 18%, rgba(255,255,255,.15), transparent 32%);
        }
        .login-header i {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .school-mark {
            width: 72px;
            height: 72px;
            display: grid;
            place-items: center;
            margin: 0 auto 12px;
            border: 1px solid rgba(255,255,255,.38);
            border-radius: 22px;
            background: rgba(255,255,255,.1);
            color: #ffe3a1;
        }
        .school-caption { letter-spacing: .12em; color: #dceafa; }
        .login-body {
            padding: 30px;
        }
        .login-body .form-control { border-color: #cbd8e6; background-color: #fff; }
        .login-body .form-control:focus { border-color: var(--school-blue); box-shadow: 0 0 0 .2rem rgba(40, 120, 200, .15); }
        .btn-login {
            background: var(--school-blue);
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background: var(--school-navy);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(20, 54, 93, 0.28);
        }
        @media (max-width: 700px) { .school-art { opacity: .2; } .school-art.books { left: -6%; bottom: 0; } .school-art.pencil { right: -4%; top: 3%; } .school-art.chalkboard { display: none; } }
        @media (max-width: 480px) { .login-body { padding: 24px 20px; } .login-header { padding: 26px 18px; } .school-art.books, .school-art.cap { display: none; } }
    </style>
</head>
<body>

<div class="login-stage">
<div class="school-art books" aria-hidden="true"><i class="bi bi-journals"></i></div>
<div class="school-art pencil" aria-hidden="true"><i class="bi bi-pencil-fill"></i></div>
<div class="school-art chalkboard" aria-hidden="true"><i class="bi bi-easel2-fill"></i></div>
<div class="school-art cap" aria-hidden="true"><i class="bi bi-mortarboard-fill"></i></div>
<div class="login-card">
    <div class="login-header">
        <div class="school-mark"><i class="bi bi-book-half"></i></div>
        <div class="school-caption small fw-semibold mb-2">TRUNG TÂM HỌC TẬP</div>
        <h3 class="fw-bold mb-1">LUYỆN THI HÙNG CƯỜNG</h3>
        <p class="mb-0 text-white-50 small">Kết nối học tập · Đồng hành cùng phụ huynh</p>
    </div>

    <div class="login-body">
        <!-- Thông báo đăng ký thành công -->
        <div th:if="${param.registered}" class="alert alert-success alert-dismissible fade show small" role="alert">
            <i class="bi bi-check-circle-fill me-1"></i> Đăng ký tài khoản thành công! Vui lòng đăng nhập.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Thông báo đăng xuất -->
        <div th:if="${param.logout}" class="alert alert-info alert-dismissible fade show small" role="alert">
            <i class="bi bi-info-circle-fill me-1"></i> Bạn đã đăng xuất khỏi hệ thống.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Thông báo lỗi đăng nhập -->
        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show small" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> Sai tên đăng nhập hoặc mật khẩu!
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Form đăng nhập -->
        <form th:action="@{/login}" method="post">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username" name="username" placeholder="Tên đăng nhập" required autofocus>
                <label for="username"><i class="bi bi-person me-1"></i> Tên đăng nhập</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password" name="password" placeholder="Mật khẩu" required>
                <label for="password"><i class="bi bi-lock me-1"></i> Mật khẩu</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-login mt-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
            </button>
        </form>

        <div class="text-center mt-3">
            <span class="text-muted small">Chưa có tài khoản phụ huynh?</span>
            <a th:href="@{/register}" class="text-decoration-none fw-semibold small ms-1">Đăng ký ngay</a>
        </div>
    </div>
</div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
