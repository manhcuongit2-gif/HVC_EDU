<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Làm bài thi</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}"></head>
<body class="bg-light"><main class="container py-4">
  <div class="d-flex justify-content-between align-items-center sticky-top bg-light py-2"><div><h1 class="h4 mb-0" th:text="${attempt.title}"></h1><span class="small text-secondary" th:text="${attempt.subject}"></span><div class="small text-secondary" th:if="${attempt.scope != null and !attempt.scope.isBlank()}" th:text="|Phạm vi: ${attempt.scope}|"></div></div><div class="text-end"><div id="timer" class="fs-4 fw-bold text-danger">--:--</div><div id="saveStatus" class="small text-secondary">Đang tải bài đã lưu</div></div></div>
  <div th:if="${attempt.status != 'IN_PROGRESS'}" class="alert alert-info mt-3"><span th:if="${attempt.autoSubmitted}">Hết giờ, hệ thống đã tự nộp bài. </span><span th:if="${attempt.status == 'WAITING_REVIEW'}">Một số câu đang chờ giáo viên chấm.</span><span th:if="${attempt.status != 'WAITING_REVIEW'}">Lượt thi đã được nộp. Kết quả sẽ hiển thị sau khi giáo viên công bố.</span><a class="d-block mt-2" th:href="@{/student/exams}">Quay lại danh sách bài thi</a></div>
  <form id="submitAttempt" th:if="${attempt.status == 'IN_PROGRESS'}" method="post" th:action="@{/student/exams/attempt/{id}/submit(id=${attempt.attemptId})}" class="mb-3"><button class="btn btn-primary">Nộp bài</button></form>
  <article th:each="q,stat : ${attempt.questions}" class="card border-0 shadow-sm rounded-4 mb-3"><div class="card-body">
    <h2 class="h6" th:text="|Câu ${stat.count} · ${q.points} điểm|"></h2><div class="math-content mb-3" style="white-space:pre-wrap" th:text="${q.prompt}"></div>
    <div th:if="${q.type == 'MULTIPLE_CHOICE' or q.type == 'TRUE_FALSE'}"><label th:each="option : ${q.options}" class="d-flex gap-2 align-items-start border rounded p-2 mb-2"><input type="radio" th:name="|answer-${q.questionNumber}|" th:checked="${q.selectedOptionKey == option.key}" th:attr="data-question=${q.questionNumber},data-option=${option.key}" th:disabled="${attempt.status != 'IN_PROGRESS'}"><span th:text="|${option.key}. ${option.text}|"></span></label></div>
    <div th:if="${q.type == 'FILL_IN'}"><label class="form-label">Câu trả lời</label><input class="form-control exam-text-answer" th:value="${q.answerText}" th:attr="data-question=${q.questionNumber}" maxlength="10000" th:disabled="${attempt.status != 'IN_PROGRESS'}"></div>
    <div th:if="${q.type == 'ESSAY'}"><label class="form-label">Bài làm</label><textarea class="form-control exam-text-answer" rows="5" th:text="${q.answerText}" th:attr="data-question=${q.questionNumber}" maxlength="10000" th:disabled="${attempt.status != 'IN_PROGRESS'}"></textarea></div>
  </div></article>
  <form th:if="${attempt.status == 'IN_PROGRESS'}" method="post" th:action="@{/student/exams/attempt/{id}/submit(id=${attempt.attemptId})}"><button class="btn btn-primary btn-lg">Nộp bài thi</button></form>
  <script th:if="${attempt.status == 'IN_PROGRESS'}" th:inline="javascript">
    const deadlineMillis = [[${attempt.deadlineEpochMillis}]];
    const serverMillis = [[${attempt.serverEpochMillis}]];
    const saveUrl = /*[[@{/student/exams/attempt/{id}/answer(id=${attempt.attemptId})}]]*/ '';
    const csrfToken = document.querySelector('meta[name="_csrf"]').content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
    const statusBox = document.getElementById('saveStatus');
    let pending = new Map(), saveTimer = null, deadlineReached = false, secondsLeft = Math.max(0, Math.floor((deadlineMillis-serverMillis)/1000));
    const startedAt = performance.now();
    function queueSave(question, text, option) {
      pending.set(question, {questionNumber: question, answerText: text, optionKey: option});
      statusBox.textContent = 'Đang lưu câu trả lời…';
      clearTimeout(saveTimer); saveTimer = setTimeout(flush, 250);
    }
    let flushPromise = null;
    async function flush() {
      if (flushPromise) return flushPromise;
      flushPromise = flushPending();
      try { await flushPromise; } finally { flushPromise = null; }
    }
    async function flushPending() {
      do {
      const items = [...pending.values()];
      for (const item of items) {
        const body = new URLSearchParams(); body.set('questionNumber', item.questionNumber);
        if (item.answerText !== null) body.set('answerText', item.answerText);
        if (item.optionKey !== null) body.set('optionKey', item.optionKey);
        try {
          const response = await fetch(saveUrl, {method:'POST', credentials:'same-origin', headers:{[csrfHeader]:csrfToken,'Content-Type':'application/x-www-form-urlencoded'}, body});
          if (response.status === 409) { statusBox.textContent = 'Hết giờ, bài đã được tự nộp.'; document.querySelectorAll('input,textarea,button').forEach(x=>x.disabled=true); setTimeout(()=>location.href='/student/exams',1200); return; }
          if (!response.ok) throw new Error('save');
          if (pending.get(item.questionNumber) === item) pending.delete(item.questionNumber); statusBox.textContent = 'Đã lưu trên máy chủ.';
        } catch (e) {
          statusBox.textContent = 'Mất kết nối tạm thời; hệ thống sẽ thử lưu lại.';
          setTimeout(flush, 1500); return;
        }
      }
      } while (pending.size > 0);
      if (deadlineReached && pending.size === 0) document.getElementById('submitAttempt')?.requestSubmit();
    }
    document.querySelectorAll("form[action$='/submit']").forEach(form => form.addEventListener('submit', event => {
      if (form.dataset.ready === 'true') { delete form.dataset.ready; return; }
      if (pending.size === 0) return;
      event.preventDefault(); form.dataset.ready = 'true';
      flush().then(() => { if (pending.size === 0) form.requestSubmit(); else delete form.dataset.ready; });
    }));
    document.querySelectorAll('input[type=radio][data-question]').forEach(input => input.addEventListener('change', () => queueSave(input.dataset.question, null, input.dataset.option)));
    document.querySelectorAll('.exam-text-answer').forEach(input => input.addEventListener('input', () => queueSave(input.dataset.question, input.value, null)));
    function tick() {
      const elapsed = Math.floor((performance.now()-startedAt)/1000);
      const left = Math.max(0, secondsLeft-elapsed);
      const mm = String(Math.floor(left/60)).padStart(2,'0');
      const ss = String(left%60).padStart(2,'0');
      document.getElementById('timer').textContent = mm + ':' + ss;
      if (left <= 0) { deadlineReached = true; flush(); return; }
      setTimeout(tick, 1000);
    }
    tick();
  </script>
  <script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</main></body></html>
