<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kết quả thi</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/student-navigation :: menu('exams')}"></div><main class="container py-4">
  <h1 class="h3">Kết quả thi đã công bố</h1><p class="text-secondary">Điểm chính thức là điểm cao nhất trong các lượt đã chấm; điểm thi được lưu riêng với điểm môn học.</p>
  <section class="card border-0 shadow-sm"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Đề</th><th>Lớp / môn</th><th>Đóng đề</th><th>Điểm cao nhất</th><th>Tối đa</th></tr></thead><tbody>
    <tr th:each="exam : ${assignments}"><td><div th:text="${exam.title}"></div><div class="small text-secondary" th:if="${exam.scope != null and !exam.scope.isBlank()}" th:text="|Phạm vi: ${exam.scope}|"></div></td><td th:text="|${exam.className} · ${exam.subject}|"></td><td th:text="${#temporals.format(exam.closesAt,'dd/MM/yyyy HH:mm')}"></td><td><span th:text="${exam.officialScore != null ? exam.officialScore : '—'}"></span><div class="small text-secondary mt-1" th:if="${exam.teacherFeedback != null}" th:text="${exam.teacherFeedback}"></div></td><td th:text="${exam.totalPoints}"></td></tr>
    <tr th:if="${#lists.isEmpty(assignments)}"><td colspan="5" class="text-secondary text-center py-4">Chưa có kết quả.</td></tr>
  </tbody></table></div></section>
</main></body></html>
