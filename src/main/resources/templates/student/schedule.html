<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lịch học · Hùng Cường</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body{background:#f4f7fb;color:#17253b}.student-calendar{border:1px solid #e3eaf2;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 6px 20px rgba(21,50,85,.06)}
    .calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekday,.calendar-day{border-right:1px solid #e8edf4;border-bottom:1px solid #e8edf4}.weekday{padding:10px 6px;text-align:center;background:#f5f8fc;color:#607086;font-weight:700;font-size:.83rem}.calendar-day{min-height:145px;padding:7px;background:white}.calendar-day.other-month{background:#f9fafc;color:#aab4c2}.calendar-day.today{box-shadow:inset 0 0 0 2px #1769e0;background:#f1f7ff}.day-number{display:flex;justify-content:space-between;font-weight:700;margin-bottom:5px}.today-tag{font-size:.65rem;color:#1769e0}.calendar-event{border-left:3px solid var(--event-color);border-radius:5px;padding:4px 6px;margin:4px 0;background:color-mix(in srgb,var(--event-color) 10%,white);font-size:.72rem;line-height:1.25}.calendar-event summary{cursor:pointer;font-weight:700}.calendar-event.cancelled{filter:grayscale(1);opacity:.7}.attendance{font-weight:700}.attendance-PRESENT{color:#16845b}.attendance-ABSENT{color:#c73535}.attendance-EXCUSED{color:#856404}
    @media(max-width:767px){.calendar-day{min-height:90px;padding:4px 2px}.weekday{font-size:.68rem;padding:7px 1px}.calendar-event{font-size:.62rem;padding:3px}.event-detail{display:none}}
  </style>
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/student-navigation :: menu('schedule')}"></div>
<main class="container-fluid px-lg-4 py-4">
  <header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
    <div><h1 class="h3 fw-bold mb-1"><i class="bi bi-calendar-week text-primary me-2"></i>Lịch học của bạn</h1><p class="text-muted mb-0">Buổi học từ các lớp bạn đang theo học. Điểm danh chỉ xuất hiện khi đã lưu.</p></div>
  </header>
  <section class="student-calendar">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 p-3 border-bottom">
      <div class="btn-group"><a class="btn btn-outline-primary" th:href="@{/student/schedule(month=${previousMonth})}" aria-label="Tháng trước"><i class="bi bi-chevron-left"></i></a><a class="btn btn-primary" th:href="@{/student/schedule(month=${todayMonth})}">Hôm nay</a><a class="btn btn-outline-primary" th:href="@{/student/schedule(month=${nextMonth})}" aria-label="Tháng sau"><i class="bi bi-chevron-right"></i></a></div>
      <h2 class="h5 fw-bold mb-0" th:text="|Tháng ${monthLabel}|">Tháng</h2>
      <form method="get" th:action="@{/student/schedule}" class="d-flex gap-2"><input type="month" name="month" class="form-control" th:value="${selectedMonth}" aria-label="Chọn tháng"><button class="btn btn-outline-primary">Xem</button></form>
    </div>
    <div th:if="${#lists.isEmpty(portal.activeEnrollments)}" class="alert alert-info m-3">Bạn chưa có lớp đang học.</div>
    <div class="calendar-grid">
      <div class="weekday">Thứ Hai</div><div class="weekday">Thứ Ba</div><div class="weekday">Thứ Tư</div><div class="weekday">Thứ Năm</div><div class="weekday">Thứ Sáu</div><div class="weekday">Thứ Bảy</div><div class="weekday">Chủ Nhật</div>
      <div th:each="day : ${calendarDays}" class="calendar-day" th:classappend="|${day.currentMonth ? '' : 'other-month'} ${day.today ? 'today' : ''}|"><div class="day-number"><span th:text="${day.date.dayOfMonth}">1</span><span th:if="${day.today}" class="today-tag">HÔM NAY</span></div>
        <details th:each="event : ${day.events}" class="calendar-event" th:classappend="${event.session.status == 'CANCELLED' ? ' cancelled' : ''}" th:style="|--event-color:${event.color}|"><summary><span th:text="${#temporals.format(event.session.startTime,'HH:mm')}"></span> · <span th:text="${event.session.classEntity.name}"></span></summary><div class="event-detail mt-1"><span th:text="${event.session.classEntity.subject.name}"></span><br><span th:text="|${#temporals.format(event.session.startTime,'HH:mm')}–${#temporals.format(event.session.endTime,'HH:mm')}|"></span><span th:if="${event.session.room != null}" th:text="| · ${event.session.room.name}|"></span><br>Trạng thái buổi học: <span th:text="${event.session.status == 'CANCELLED' ? 'Đã hủy' : (event.session.status == 'SCHEDULED' ? 'Đã lên lịch' : event.session.status)}"></span><div th:if="${event.attendanceStatus != null}" class="attendance mt-1" th:classappend="| attendance-${event.attendanceStatus}|">Điểm danh: <span th:text="${event.attendanceStatus == 'PRESENT' ? 'Có mặt' : (event.attendanceStatus == 'ABSENT' ? 'Vắng' : (event.attendanceStatus == 'EXCUSED' ? 'Có phép' : event.attendanceStatus))}"></span><div th:if="${event.attendanceNote != null and !event.attendanceNote.isBlank()}" class="small fw-normal" th:text="${event.attendanceNote}"></div></div><div th:unless="${event.attendanceStatus != null}" class="small text-muted mt-1">Chưa có điểm danh được lưu.</div></div></details>
      </div>
    </div>
  </section>
</main>
</body>
</html>
