<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Trao đổi với giáo viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-4"><div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3"><div><h1 class="h3">Trao đổi với giáo viên</h1><p class="text-muted mb-0">Chọn lớp để nhắn riêng với giáo viên phụ trách.</p></div><a th:href="@{/parent/dashboard}" class="btn btn-outline-secondary">Dashboard</a></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div th:if="${#lists.isEmpty(classes)}" class="alert alert-info">Con chưa có lớp đang theo học để trò chuyện.</div>
    <div class="list-group"><a th:each="c : ${classes}" th:href="@{/parent/messages/{id}(id=${c.id})}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"><span><strong th:text="${c.name}"></strong><small class="d-block text-muted" th:text="${c.teacher.user.fullName}"></small></span><span class="btn btn-sm btn-outline-primary">Mở hội thoại</span></a></div>
</main></body></html>
