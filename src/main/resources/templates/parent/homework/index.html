<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bài tập của con · EduCenter</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">    <link rel="stylesheet" th:href="@{/css/parent-portal.css}">
</head>
<body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/parent-navigation :: menu('homework')}"></div><main class="container py-4">
  <div class="mb-4"><h1 class="h3">Bài tập của con</h1><p class="text-secondary">Phụ huynh có thể tải bài làm lên thay con. Hệ thống vẫn nhận bài nộp muộn và sẽ ghi rõ trạng thái.</p></div>
  <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
  <div class="row g-3"><div th:each="row : ${rows}" class="col-12"><article class="card border-0 shadow-sm rounded-4"><div class="card-body p-4"><div class="d-flex flex-wrap justify-content-between gap-2"><div><span class="badge text-bg-primary mb-2" th:text="${row.assignment.classEntity.name}"></span><h2 class="h5 mb-1" th:text="${row.assignment.title}"></h2><div class="small text-secondary">Học sinh: <strong th:text="${row.student.fullName}"></strong> · Hạn <span th:text="${#temporals.format(row.assignment.dueAt,'HH:mm dd/MM/yyyy')}"></span></div></div><div class="text-end" th:if="${row.submission != null}"><span class="badge" th:classappend="${row.submission.status == 'REVIEWED' ? ' text-bg-success' : (row.submission.late ? ' text-bg-warning' : ' text-bg-info')}" th:text="${row.submission.status == 'REVIEWED' ? 'Đã chấm' : (row.submission.late ? 'Đã nộp – Chờ giáo viên chấm · nộp muộn' : 'Đã nộp – Chờ giáo viên chấm')}"></span><div th:if="${row.submission.score != null}" class="fw-bold mt-1"><span th:text="${row.submission.score}"></span>/10</div></div></div>
    <p class="my-3" style="white-space:pre-wrap" th:text="${row.assignment.instructions}"></p><a th:if="${row.assignment.attachmentStoredFilename != null}" class="btn btn-sm btn-outline-secondary mb-3" th:href="@{/parent/homework/{id}/attachment(id=${row.assignment.id})}">Tải tệp hướng dẫn</a>
    <div th:if="${row.submission != null && row.submission.submissionText != null}" class="border rounded bg-light p-3 mb-3" style="white-space:pre-wrap" th:text="${row.submission.submissionText}"></div><div th:if="${row.submission != null && row.submission.feedback != null}" class="alert alert-success py-2"><strong>Nhận xét giáo viên:</strong> <span th:text="${row.submission.feedback}"></span></div>
    <a th:if="${row.submission != null && row.submission.attachmentStoredFilename != null}" class="small d-block mb-2" th:href="@{/parent/homework/submission/{id}/file(id=${row.submission.id})}">Tải lại bài đã nộp</a>
    <form th:action="@{/parent/homework/{id}/submit(id=${row.assignment.id})}" method="post" enctype="multipart/form-data" class="d-flex flex-wrap gap-2 align-items-end"><input type="hidden" name="studentId" th:value="${row.student.id}"><div><label class="form-label small" th:text="${row.submission == null ? 'Tệp bài làm' : 'Nộp lại bài'}"></label><input class="form-control form-control-sm" type="file" name="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.jpg,.jpeg,.png,.webp,.zip" required></div><button class="btn btn-primary btn-sm" th:text="${row.submission == null ? 'Nộp bài' : 'Gửi bản mới'}"></button></form>
  </div></article></div><div th:if="${#lists.isEmpty(rows)}" class="col-12"><div class="alert alert-info">Hiện chưa có bài tập cho lớp của các con.</div></div></div>
</main></body></html>
