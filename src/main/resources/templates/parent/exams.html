<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kết quả thi của con</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">    <link rel="stylesheet" th:href="@{/css/parent-portal.css}">
</head>
<body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/parent-navigation :: menu('exams')}"></div><main class="container py-4">
  <h1 class="h3">Kết quả thi của con</h1><p class="text-secondary">Chỉ hiển thị kết quả của học sinh đã liên kết với tài khoản phụ huynh.</p>
  <section class="card border-0 shadow-sm mb-4"><div class="card-header bg-white fw-semibold">Đề PDF đã chấm</div><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Học sinh</th><th>Đề</th><th>Lớp / môn</th><th>Điểm</th><th>Nhận xét</th></tr></thead><tbody>
    <tr th:each="row : ${pdfAssignments}"><td th:text="${row.student.fullName}"></td><td th:text="${row.assignment.title}"></td><td th:text="|${row.assignment.classEntity.name} · ${row.assignment.classEntity.subject.name}|"></td><td th:text="|${row.submission.score} / 10|"></td><td th:text="${row.submission.feedback != null ? row.submission.feedback : '—'}"></td></tr>
    <tr th:if="${#lists.isEmpty(pdfAssignments)}"><td colspan="5" class="text-center text-secondary py-3">Chưa có bài PDF được chấm.</td></tr>
  </tbody></table></div></section>
  <section class="card border-0 shadow-sm"><div class="card-header bg-white fw-semibold">Kết quả trực tuyến đã công bố</div><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Học sinh</th><th>Đề</th><th>Lớp / môn</th><th>Điểm cao nhất</th><th>Tối đa</th></tr></thead><tbody>
    <tr th:each="exam : ${assignments}"><td th:text="${exam.studentName}"></td><td><div th:text="${exam.title}"></div><div class="small text-secondary" th:if="${exam.scope != null and !exam.scope.isBlank()}" th:text="|Phạm vi: ${exam.scope}|"></div></td><td th:text="|${exam.className} · ${exam.subject}|"></td><td><span th:text="${exam.officialScore != null ? exam.officialScore : '—'}"></span><div class="small text-secondary mt-1" th:if="${exam.teacherFeedback != null}" th:text="${exam.teacherFeedback}"></div></td><td th:text="${exam.totalPoints}"></td></tr>
    <tr th:if="${#lists.isEmpty(assignments)}"><td colspan="5" class="text-center text-secondary py-3">Chưa có kết quả trực tuyến được công bố.</td></tr>
  </tbody></table></div></section>
</main></body></html>
