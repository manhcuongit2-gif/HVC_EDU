# ============================
# LUYỆN THI HÙNG CƯỜNG - APPLICATION CONFIG
# ============================

# Server
server.port=8080
app.storage.upload-dir=${EDUCENTER_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB

# ============================
# DATABASE (MySQL)
# ============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/educenter_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================
# JPA / Hibernate
# Hibernate does not generate schema; Flyway applies versioned additive migrations.
# ============================
spring.jpa.hibernate.ddl-auto=none

# Web Push is disabled until a VAPID key pair has been configured.
app.push.vapid.enabled=${APP_PUSH_ENABLED:false}
app.push.vapid.public-key=${APP_PUSH_VAPID_PUBLIC_KEY:}
app.push.vapid.private-key=${APP_PUSH_VAPID_PRIVATE_KEY:}
app.push.vapid.subject=${APP_PUSH_VAPID_SUBJECT:mailto:admin@example.com}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Existing installations are baselined before additive Flyway migrations run.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ============================
# Thymeleaf
# ============================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ============================
# Static Resources
# ============================
spring.web.resources.static-locations=classpath:/static/

# ============================
# Logging
# ============================
logging.level.root=INFO
logging.level.com.educenter=DEBUG
logging.level.org.springframework.security=DEBUG

# ============================
# VNPay (Placeholder - Dien thong tin that khi co)
# ============================
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.api-url=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
vnpay.tmn-code=YOUR_TMN_CODE
vnpay.hash-secret=YOUR_HASH_SECRET
vnpay.return-url=http://localhost:8080/api/vnpay/return
